syntax = "proto3";

package desk;

import "koinos/options.proto";

// ════════════════════════════ Stored objects ════════════════════════════

message config_object {
  bytes owner = 1 [(koinos.btype) = ADDRESS];          // runs the desk: fee, limits, pause, node key, upgrades
  bytes treasury = 2 [(koinos.btype) = ADDRESS];       // the ONLY address the desk's KOIN/VHP can ever be withdrawn to
  uint32 fee_bps = 3;                                  // fee in basis points: 300 = 3%
  uint64 min_swap = 4 [jstype = JS_STRING];            // smallest swap in VHP units (1 VHP = 100000000)
  uint64 max_swap = 5 [jstype = JS_STRING];            // largest single swap in VHP units; 0 = only limited by what is available
  bool paused = 6;                                     // stops swaps (withdrawals to the treasury still work)
  uint64 timelock_length = 7 [jstype = JS_STRING];     // delay (ms) for treasury changes and code upgrades
  uint64 daily_cap = 8 [jstype = JS_STRING];           // v2: most KOIN all swaps together may pay out per 24 h; 0 = no cap
}

message totals_object {
  uint64 swaps = 1 [jstype = JS_STRING];               // number of swaps
  uint64 vhp_in = 2 [jstype = JS_STRING];              // all VHP received from swaps
  uint64 koin_out = 3 [jstype = JS_STRING];            // all KOIN paid out by swaps
  uint32 next_slot = 4;                                // where the next swap goes in the recent-swaps list
  uint64 day_start = 5 [jstype = JS_STRING];           // v2: start (ms) of the current 24-hour cap window
  uint64 day_out = 6 [jstype = JS_STRING];             // v2: KOIN paid out by swaps in that window
}

message swap_record {
  bytes account = 1 [(koinos.btype) = ADDRESS];
  uint64 vhp_in = 2 [jstype = JS_STRING];
  uint64 koin_out = 3 [jstype = JS_STRING];
  uint64 time = 4 [jstype = JS_STRING];                // block time (ms)
}

message timelock_object {
  bytes hash = 1 [(koinos.btype) = HEX];               // upgrades: sha256 of the announced bytecode
  bytes address = 2 [(koinos.btype) = ADDRESS];        // treasury change: the new treasury
  uint64 eta = 3 [jstype = JS_STRING];                 // time (ms) from which it can be carried out
}

// v2: changes that loosen a setting wait for the timelock (a stolen owner key can't drain the desk at once).
message pending_settings {
  bool has_fee = 1;
  uint32 fee_bps = 2;                                  // a LOWER fee
  bool has_cap = 3;
  uint64 daily_cap = 4 [jstype = JS_STRING];           // a HIGHER daily cap (or 0 = none)
  bytes public_key = 5;                                // a new block-producer key
  uint64 eta = 6 [jstype = JS_STRING];                 // time (ms) from which apply_settings carries them out
}

message ledger_object {                               // test builds only: simulated token balances
  uint64 amount = 1 [jstype = JS_STRING];
}

// ════════════════════════════ Read-only ════════════════════════════

// @description The desk's settings, totals and how much KOIN can be swapped out right now.
// @read-only true
message get_state_arguments {}

message get_state_result {
  config_object config = 1;
  totals_object totals = 2;
  uint64 koin_balance = 3 [jstype = JS_STRING];
  uint64 vhp_balance = 4 [jstype = JS_STRING];
  uint64 mana = 5 [jstype = JS_STRING];
  uint64 available = 6 [jstype = JS_STRING];           // most KOIN one swap can pay out right now
  uint64 max_vhp_in = 7 [jstype = JS_STRING];          // largest VHP amount one swap can take right now
  uint64 time = 8 [jstype = JS_STRING];
  timelock_object upgrade = 9;
  timelock_object treasury_change = 10;
  timelock_object owner_change = 11;                   // v2: a proposed new owner (address) and from when it can accept
  pending_settings pending = 12;                       // v2
  uint64 swap_left_today = 13 [jstype = JS_STRING];    // v2: KOIN the daily cap still allows (0 with no cap: see available)
}

// @description What a swap of this many VHP would pay right now.
// @read-only true
message quote_arguments {
  uint64 vhp_amount = 1 [jstype = JS_STRING];
}

message quote_result {
  uint64 koin_out = 1 [jstype = JS_STRING];
  uint64 fee = 2 [jstype = JS_STRING];
  string problem = 3;                                  // empty when the swap would go through
}

// @description The most recent swaps, newest first.
// @read-only true
message get_recent_arguments {}

message get_recent_result {
  repeated swap_record swaps = 1;
}

// ════════════════════════════ Setup ════════════════════════════

// @description One-time setup, signed by the contract's own key.
// @read-only false
message init_arguments {
  bytes owner = 1 [(koinos.btype) = ADDRESS];
  bytes treasury = 2 [(koinos.btype) = ADDRESS];
  uint32 fee_bps = 3;
  uint64 min_swap = 4 [jstype = JS_STRING];
  uint64 max_swap = 5 [jstype = JS_STRING];
  uint64 timelock_length = 6 [jstype = JS_STRING];
}

message init_result {}

// ════════════════════════════ Swapping ════════════════════════════

// @description Swap VHP for KOIN. Approve this contract for the VHP in the same transaction. Fails instead of paying less than min_koin_out.
// @read-only false
message swap_arguments {
  bytes from = 1 [(koinos.btype) = ADDRESS];
  uint64 vhp_amount = 2 [jstype = JS_STRING];
  uint64 min_koin_out = 3 [jstype = JS_STRING];
}

message swap_result {
  uint64 koin_out = 1 [jstype = JS_STRING];
  uint64 fee = 2 [jstype = JS_STRING];
}

// ════════════════════════════ Owner ════════════════════════════

// @description Send KOIN from the desk to the treasury (owner only; capped by the desk's Mana).
// @read-only false
message withdraw_koin_arguments {
  uint64 amount = 1 [jstype = JS_STRING];
}

message withdraw_koin_result {
  uint64 amount = 1 [jstype = JS_STRING];
}

// @description Send VHP from the desk to the treasury (owner only).
// @read-only false
message withdraw_vhp_arguments {
  uint64 amount = 1 [jstype = JS_STRING];
}

message withdraw_vhp_result {}

// @description Set the fee in basis points, at most 1000 = 10% (owner only). A higher fee applies at once; a lower one waits for the timelock and apply_settings (v2).
// @read-only false
message set_fee_arguments {
  uint32 fee_bps = 1;
}

message set_fee_result {
  uint64 eta = 1 [jstype = JS_STRING];                 // v2: 0 = applied now; a lower fee waits until this time
}

// @description Set the smallest and largest single swap in VHP units; max 0 = no fixed cap (owner only).
// @read-only false
message set_limits_arguments {
  uint64 min_swap = 1 [jstype = JS_STRING];
  uint64 max_swap = 2 [jstype = JS_STRING];
}

message set_limits_result {}

// @description Set the most KOIN all swaps may pay out per 24 hours; 0 = no cap. Lowering it applies at once; raising
// it (or removing it) waits for the timelock and apply_settings (owner only). (v2)
// @read-only false
message set_daily_cap_arguments {
  uint64 daily_cap = 1 [jstype = JS_STRING];
}

message set_daily_cap_result {
  uint64 eta = 1 [jstype = JS_STRING];                 // 0 = applied now
}

// @description Carry out the waiting fee cut, cap increase and/or producer key once the timelock has passed (owner only). (v2)
// @read-only false
message apply_settings_arguments {}

message apply_settings_result {}

// @description Drop the waiting settings changes (owner only). (v2)
// @read-only false
message cancel_settings_arguments {}

message cancel_settings_result {}

// @description Step 1 of handing over the desk: the owner proposes a new owner, who can accept after the timelock. (v2)
// @read-only false
message propose_owner_arguments {
  bytes new_owner = 1 [(koinos.btype) = ADDRESS];
}

message propose_owner_result {
  uint64 eta = 1 [jstype = JS_STRING];
}

// @description Step 2: the proposed owner accepts, after the timelock. Waiting changes and an announced upgrade or treasury change are cleared. (v2)
// @read-only false
message accept_owner_arguments {}

message accept_owner_result {}

// @description Cancel a proposed owner change (owner only). (v2)
// @read-only false
message cancel_owner_arguments {}

message cancel_owner_result {}

// @description Pause or resume swaps (owner only).
// @read-only false
message set_paused_arguments {
  bool paused = 1;
}

message set_paused_result {}

// @description Announce the desk's block-producer key; apply_settings registers it with Proof-of-Burn after the timelock (owner only, v2).
// @read-only false
message register_key_arguments {
  bytes public_key = 1 [(koinos.btype) = BASE64];
}

message register_key_result {
  uint64 eta = 1 [jstype = JS_STRING];                 // v2: the key is registered by apply_settings from this time
}

// @description Announce a new treasury address; it takes effect with apply_treasury after the timelock (owner only).
// @read-only false
message schedule_treasury_arguments {
  bytes treasury = 1 [(koinos.btype) = ADDRESS];
}

message schedule_treasury_result {
  uint64 eta = 1 [jstype = JS_STRING];
}

// @description Make the announced treasury change after its timelock (owner only).
// @read-only false
message apply_treasury_arguments {}

message apply_treasury_result {}

// @description Cancel an announced treasury change (owner only).
// @read-only false
message cancel_treasury_arguments {}

message cancel_treasury_result {}

// @description Announce a code upgrade by the sha256 of its bytecode; it can be uploaded after the timelock (owner only).
// @read-only false
message schedule_upgrade_arguments {
  bytes hash = 1 [(koinos.btype) = HEX];
}

message schedule_upgrade_result {
  uint64 eta = 1 [jstype = JS_STRING];
}

// @description Cancel an announced code upgrade (owner only).
// @read-only false
message cancel_upgrade_arguments {}

message cancel_upgrade_result {}
