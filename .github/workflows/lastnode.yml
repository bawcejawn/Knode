          CHAIN_OK = {}
          def check_hour_on_chain(f, j, i, h):
              """Fix-check N-1: a newly published hour is what both nodes say."""
              t0 = j["start"] + i * H; t1 = t0 + H
              if len(RPCS) < 2 or RPCS[0] == RPCS[1]: bad("%s: hour %d can't be checked on the chain (LASTNODE_RPC and LASTNODE_RPC_CHECK must be two nodes)" % (f, i)); return
              got = []
              for u in RPCS:
                  try: c, why = window_on(u, t0, t1, h["from"], h["to"])
                  except Exception as e: bad("%s: hour %d couldn't be read on the chain (%s); tried again next run" % (f, i, str(e)[:200])); return
                  if why: bad("%s: hour %d's blocks %d-%d: %s (on %s)" % (f, i, h["from"], h["to"], why, u)); return
                  got.append(c)
              if got[0] != got[1]: bad("%s: hour %d: the two nodes disagree about its blocks; tried again next run" % (f, i)); return
              names = [x["a"] for x in j["field"]["nodes"]]
              want = {a: got[0].get(a, 0) for a in names}
              have = {a: int(h["blocks"].get(a, 0)) for a in names}
              if want != have: bad("%s: hour %d's block counts aren't the chain's" % (f, i))
          def picks_on(url, rnd):
              """Picks list_picks for game 13, round rnd: [player, start, time] / [player, start, time, backup], as the recorder keeps them."""
              out, after = [], b""
              for page in range(1000):
                  args = pb_varint(1 << 3) + pb_varint(13) + pb_varint(2 << 3) + pb_varint(rnd) + (pb_varint(3 << 3 | 2) + pb_varint(len(after)) + after if after else b"") + pb_varint(4 << 3) + pb_varint(100)
                  r = rpc(url, "chain.read_contract", {"contract_id": PICKS, "entry_point": 2118033200, "args": base64.urlsafe_b64encode(args).decode().rstrip("=")})
                  raw = r.get("result") or ""
                  rows = [v for f, v in pb_fields(base64.urlsafe_b64decode(raw + "=" * (-len(raw) % 4))) if f == 1]
                  for row in rows:
                      player, prods, t = None, [], 0
                      for f, v in pb_fields(row):
                          if f == 1: player = v
                          if f == 2:
                              for g, w in pb_fields(v):
                                  if g == 1: prods.append(b58_str(w))
                                  if g == 4: t = w
                      if player is None: continue
                      after = player
                      pa = b58_str(player)
                      if t >= lock_of(rnd): continue                        # fix-check L-5: only picks made before the lock count
                      if len(prods) == 1: out.append([pa, prods[0], t])
                      elif len(prods) == 2 and prods[0] != prods[1]: out.append([pa, prods[0], t, prods[1]])
                  if len(rows) < 100: break
              return sorted(out)
          # The real game's round for an event: its target is 13:55 UTC (lead 5 minutes after the 13:50 lock); the lock is the target − lead.
          OFFSET = (14 * H - 10 * 60000 + 5 * 60000) % DAY
          def round_of(start): return (start - 10 * 60000 + 5 * 60000 - OFFSET) // DAY
          def lock_of(rnd): return rnd * DAY + OFFSET - 5 * 60000
          def check_picks_on_chain(f, j):
              if not PICKS: bad("%s: its picks can't be checked (LASTNODE_PICKS isn't set)" % f); return
              if len(RPCS) < 2 or RPCS[0] == RPCS[1]: bad("%s: its picks can't be checked on the chain (two nodes needed)" % f); return
              try: a, b = picks_on(RPCS[0], round_of(j["start"])), picks_on(RPCS[1], round_of(j["start"]))
              except Exception as e: bad("%s: its picks couldn't be read on the chain (%s); tried again next run" % (f, str(e)[:200])); return
              if a != b: bad("%s: the two nodes disagree about its picks; tried again next run" % f); return
              if sorted(j["picks"].get("0", [])) != a: bad("%s: its picks aren't the Picks contract's" % f)

          # Fix-check N-8: JavaScript's Math.round exactly (floor(x + 0.5) is wrong at 0.49999999999999994).
          def js_round(x):
              r = math.floor(x)
              return r + 1 if x - r >= 0.5 else r
          def r2(x): return js_round(x * 100) / 100
          def card_total(c):
              t = 0
              for x in (c.get("field") or []) + (c.get("paddock") or []):
                  if type(x) is dict and type(x.get("vhp")) in (int, float) and x["vhp"] > 0: t += x["vhp"]
              return r2(t)
          def opens_of(start): return round_of(start) * DAY + OFFSET - DAY
          def card_time_of(start): return (opens_of(start) - H) // H * H
          def check_field_card(f, j):
              """Fix-check N-1: a newly published field is the one its race card gives: the event's card (the first one taken from
              the card time to when picks open), every node's VHP and expected blocks from it (and its form), the nodes the card's
              VHP puts in the field, and each handicap from the formula at the field's c. (c's calibration and the form's 48 hours
              are the record job's; see the README.)"""
              fd = j["field"]
              ct, op = card_time_of(j["start"]), opens_of(j["start"])
              cands = [c for c in CARDS if ct <= c["at"] < op]
              if not cands: bad("%s: its field names a race card that isn't on race-data" % f); return
              c = cands[0]
              if fd["at"] != c["at"]: bad("%s: its field isn't from the event's race card (the first one taken from %d)" % (f, ct)); return
              if fd.get("vt") != card_total(c): bad("%s: its field's card total isn't its race card's" % f)
              rows = [x for x in c["field"] if type(x) is dict and type(x.get("a")) is str and type(x.get("vhp")) in (int, float) and x["vhp"] > 0 and type(x.get("k")) in (int, float) and x["k"] > 0]
              rows = [{"a": x["a"], "vhp": x["vhp"], "k0": x["k"] / 6} for x in rows]
              rows = [x for x in rows if x["k0"] >= 20]
              rows.sort(key=lambda x: (-x["vhp"], x["a"]))
              rows = rows[:23]
              nodes = fd["nodes"]
              if [x["a"] for x in rows] != [n["a"] for n in nodes]: bad("%s: its field's nodes aren't the ones its race card gives" % f); return
              form = "r" in nodes[0]
              if form and not (type(fd.get("form")) is dict and fd["form"].get("to") == ct and fd["form"].get("from") == ct - 48 * H): bad("%s: its form isn't the 48 hours before the card time" % f)
              ks = []
              for x, n in zip(rows, nodes):
                  r = n["r"] if form else 1
                  k = x["k0"] * r
                  ks.append(k)
                  if n["vhp"] != r2(x["vhp"]) or n["kh"] != r2(k): bad("%s: node %s's VHP or expected blocks aren't its race card's" % (f, n["a"])); return
              order = sorted(range(len(ks)), key=lambda i: (-ks[i], i)) if form else list(range(len(ks)))
              kTop, cc = ks[order[0]], fd["c"]
              if not any(cc == g / 10 for g in range(26)) or not cc < math.sqrt(min(ks)) * 0.8 and cc != 0: bad("%s: its c isn't one the calibration can give" % f); return
              for k, n in zip(ks, nodes):
                  h = js_round(((kTop / k) * (1 - cc / math.sqrt(k)) / (1 - cc / math.sqrt(kTop))) * 10000) / 10000
                  if n["h"] != h: bad("%s: node %s's handicap isn't the formula's at c = %s" % (f, n["a"], cc)); return

          # ── the rules (ports of lastnode-math.js cutsFrom and playerResult; the board as the recorder builds it) ──
          BONUS_STAYED, BONUS_JUMPED = 5, 3
          def h_int(n): return js_round(n["h"] * 10000)                  # JavaScript's Math.round (N-8)
          def cuts_from(field, hours):
              nodes = field["nodes"]; n = len(nodes)
              steps, blocks, out, cuts = [0] * n, [0] * n, [0] * n, []
              for hr, hrow in enumerate(hours):
                  if len(cuts) >= n - 1: break
                  b = hrow.get("blocks") or {}
                  hh = hrow.get("hh") or {}
                  for i in range(n):
                      if not out[i]:
                          k = int(b.get(nodes[i]["a"], 0)); blocks[i] += k
                          base, low = h_int(nodes[i]), hh.get(nodes[i]["a"])
                          steps[i] += k * (low if type(low) is int and 1 <= low < base else base)
                  worst = -1
                  for i in range(n):
                      if out[i]: continue
                      if worst < 0: worst = i; continue
                      w = worst
                      if steps[i] < steps[w] or (steps[i] == steps[w] and (blocks[i] < blocks[w] or (blocks[i] == blocks[w] and
                          (nodes[i]["vhp"] < nodes[w]["vhp"] or (nodes[i]["vhp"] == nodes[w]["vhp"] and nodes[i]["a"] > nodes[w]["a"]))))): worst = i
                  out[worst] = len(cuts) + 1
                  cuts.append({"at": hr + 1, "a": nodes[worst]["a"], "steps": steps[worst], "blocks": blocks[worst]})
              standing = [x["a"] for i, x in enumerate(nodes) if not out[i]]
              done = len(cuts) == n - 1
              return {"cuts": cuts, "standing": standing, "done": done, "winner": standing[0] if done else None}
          def race_cut(field, c):
              """Port of lastnode-math.js raceCut: VHP added after the field's card can only lower a multiplier."""
              out = {}
              if not c: return out
              on = {}
              for x in (c.get("field") or []) + (c.get("paddock") or []):
                  if type(x) is dict and type(x.get("a")) is str and type(x.get("vhp")) in (int, float) and x["vhp"] > 0 and x["a"] not in on: on[x["a"]] = x["vhp"]
              for n in field["nodes"]:
                  v = on.get(n["a"])
                  if not v: continue
                  if not v > n["vhp"]: continue
                  h = math.floor(h_int(n) * n["vhp"] / v + 0.5)
                  if 1 <= h < h_int(n): out[n["a"]] = h
              return out
          CARDS = []
          if race and os.path.isdir(race):
              for f in sorted(os.listdir(race)):
                  if not (f.startswith("W") and f.endswith(".json")): continue
                  try: w = json.load(open(os.path.join(race, f), encoding="utf-8"))
                  except Exception: continue
                  for r in (w.get("races") or []) if type(w) is dict else []:
                      for c in (r.get("cards") or []) if type(r) is dict else []:
                          # L-10: the recorder's own filter (cardsIn): whole-number times, every row a producer with a VHP.
                          rowok = lambda x: type(x) is dict and type(x.get("a")) is str and type(x.get("vhp")) in (int, float) and x["vhp"] >= 0
                          if type(c) is dict and type(c.get("at")) is int and type(c.get("field")) is list and all(rowok(x) for x in c["field"]) and (c.get("paddock") is None or (type(c["paddock"]) is list and all(rowok(x) for x in c["paddock"]))): CARDS.append(c)
          CARDS.sort(key=lambda c: c["at"])
          def check_hour_card(f, j, i, h):
              """Fix-check N-4 (and LNF-3): a newly published window names the FIRST race card taken at or after its end (the card's
              VHP covers the whole window), so VHP moved in after the window's start is seen; only when race-data has no such card
              2 hours after the window ends, the latest card taken by its end (never older than the field's). hh must be raceCut's.
              Checked once, when the hour is first published (N-7): a card that reaches race-data later never re-judges it."""
              end = j["start"] + (i + 1) * H
