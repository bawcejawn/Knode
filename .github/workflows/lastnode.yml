              return [{"player": r["a"], "points": rank[key(r)]} for r in rows]

          # ── day files: the rules, and what is already published ──
          inc = {}
          for f in os.listdir(d):
              if f.startswith("D") and f.endswith(".json"): inc[f[1:-5]] = json.load(open(os.path.join(d, f), encoding="utf-8"))
          merged = {}
          for day in published_days():
              j = show("lastnode/D%s.json" % day)
              if j is not None: merged[day] = j
          pub = dict(merged)
          for day, j in inc.items():
              f = "D%s.json" % day
              if j["week"] != weekOf(j["start"]): bad("%s: week %s isn't the week of its start" % (f, j["week"]))       # LNF-10
              for i in range(len(j["hours"])):
                  if j["start"] + (i + 1) * H > now + 120000: bad("%s: hour %d is recorded before it ended" % (f, i))
              old = pub.get(day)
              if old is not None and "void" in old: old_n, old_field, old_picks = len(old["hours"]), old.get("field"), True
              else: old_n, old_field, old_picks = (len(old["hours"]), old.get("field"), "0" in old["picks"]) if old is not None else (0, None, False)
              # Fix-check N-1: what this run adds is checked against race-data and the chain (published parts can't change, below).
              if j["field"] and not old_field:
                  if not j["field"].get("vt"): bad("%s: a new field without its card total (vt)" % f)            # L-1
                  else: check_field_card(f, j)
              if j["field"] and "void" not in j:
                  for i in range(old_n, len(j["hours"])):
