              if (h.get("hh") or {}) != race_cut(j["field"], want): bad("%s: hour %d's lowered multipliers aren't what its race card gives" % (f, i))
          def player_result(field, res, start, backup):
              names = [x["a"] for x in field["nodes"]]
              r = {"start": start, "jumpTo": None, "out": 0, "survived": 0, "rode": False, "jumped": False, "points": 0}
              if backup == start or backup not in names: backup = None
              node, standing = start, set(names)
              for k, c in enumerate(res["cuts"]):
                  standing.discard(c["a"])
