                      check_hour_on_chain(f, j, i, j["hours"][i])
                  if "0" in j["picks"] and not old_picks: check_picks_on_chain(f, j)
                  if j["hours"] and "0" not in j["picks"] and PICKS: bad("%s: hours without the event's picks" % f)
              rp = replay(j)
              if rp is not None:
                  res, players = rp
                  if [j["cuts"], j["standing"], j["winner"], j["done"]] != [res["cuts"], res["standing"], res["winner"], res["done"]]: bad("%s: the cuts don't follow from its field and hours" % f)
                  if strip_ranked(j["players"]) != players: bad("%s: the players don't follow from its picks and cuts" % f)          # LNF-23
              elif j["players"] or j["cuts"]: bad("%s: players or cuts without a field" % f)
              if old is not None:
                  if old.get("field") and j["field"] != old["field"]: bad("%s: the field changed after it was published" % f)        # LNF-2
                  if old["picks"] and j["picks"] != old["picks"]: bad("%s: the picks changed after they were published" % f)
                  if j["hours"][:len(old["hours"])] != old["hours"]: bad("%s: published hours changed" % f)
                  if "void" in old and j != old: bad("%s: a void event changed" % f)
                  if "void" in j and "void" not in old and (old["done"] or now - j["start"] <= 3 * DAY): bad("%s: made void while it can still be recorded" % f)
                  if old["done"] and strip_ranked(j["players"]) != strip_ranked(old["players"]): bad("%s: a finished event's results changed" % f)
              merged[day] = j

          # ── last week's board and the vault file ──
          now_w = weekOf(now)
          lw_days = [j for j in merged.values() if j["week"] == now_w - 1 and j["start"] < now]
          want = board_rows(lw_days)
          def week_board(b):
              lw = b and b.get("lastWeek")
              return lw if type(lw) is dict and lw.get("week") == now_w - 1 else None
          inc_board = json.load(open(os.path.join(d, "board.json"), encoding="utf-8")) if os.path.isfile(os.path.join(d, "board.json")) else None
          pub_board = show("lastnode/board.json")
          ib, pb = week_board(inc_board), week_board(pub_board)
          # L-4: board.json shows last week's top 2,000 rows; the vault file is checked against the whole list (want).
          if ib and ib["rows"] != want[:2000]: bad("board.json: last week's rows don't add up from the day files")
          if pb and pb.get("final") and ib and (ib.get("final") is not True or ib["rows"] != pb["rows"]): bad("board.json: last week was final and has changed")
          # Fix-check N-3 (the recorder's coversWeek): last week is final only 12 hours after it ends and once every event of
          # it, from the game's first day on, is recorded and finished or void. A run that says "final" (or files a vault
          # file) any earlier is refused, so a half-recorded week can't be frozen.
          lw_start = WEEK0 + (now_w - 1) * WEEK
          first = min([j["start"] for j in merged.values()], default=None)
          want_days = [lw_start + 14 * H + k * DAY for k in range(7)]
          by_start = {j["start"]: j for j in merged.values()}
          complete = first is not None and now >= lw_start + WEEK + 12 * H and all(
              t < first or (t in by_start and (by_start[t].get("done") or "void" in by_start[t])) for t in want_days)
          vfiles = [f for f in (sorted(os.listdir(os.path.join(d, "vault"))) if os.path.isdir(os.path.join(d, "vault")) else []) if f == "W%d.json" % (now_w - 1)]
          if ((ib and ib.get("final") is True) or vfiles) and not complete: bad("board.json: last week is called final (or its vault file is filed) before every event of it is finished or void, or before 12 hours after it ended")
          final = bool((ib and ib.get("final")) or (pb and pb.get("final")))
          # ── watch-and-hold, as the recorder's watchWeek (fix-check N-9: the publish job enforces it too) ──
          import re
          REL = (os.environ.get("LASTNODE_RELEASE_WEEKS") or "").replace(" ", "")
          released = {int(x) for x in REL.split(",")} if re.fullmatch(r"\d{1,5}(,\d{1,5})*", REL) else set()
          if REL and not released: print("::warning::LASTNODE_RELEASE_WEEKS isn't a list of week numbers like 3,7; no week is released")   # I-7
          WEEK_Z, WEEK_WINS, EVENT_Z = 3.4, 2, 5
          def watch_week(days):
              by, chi, m = {}, 0, 0
              for j in sorted(days, key=lambda j: j["start"]):
                  if "void" in j or not j.get("field") or not j.get("done"): continue
                  for n in j["field"]["nodes"]:
                      s = by.setdefault(n["a"], {"got": 0, "exp": 0, "wins": 0, "events": 0, "chi": 0, "m": 0, "ev": []})
                      g, e = 0, 0
                      for h in j["hours"]:
                          base, low = h_int(n), (h.get("hh") or {}).get(n["a"])
                          used = low if type(low) is int and 1 <= low < base else base
                          g += int(h["blocks"].get(n["a"], 0))
                          e += n["kh"] * (H / 3600000) * (base / used)
                      if e > 0:
                          c = (g - e) * (g - e) / e; chi += c; m += 1; s["chi"] += c; s["m"] += 1
                      s["got"] += g; s["exp"] += e; s["events"] += 1
                      won = j["winner"] == n["a"]
                      if won: s["wins"] += 1
                      s["ev"].append((g, e, won))
              out = []
              for a, s in by.items():
                  if not s["exp"] > 0: continue
                  phi = max(1, (chi - s["chi"]) / (m - s["m"]) if m > s["m"] else 1)
                  z = (s["got"] - s["exp"]) / math.sqrt(phi * s["exp"])
                  one_day = any(won and e > 0 and (g - e) / math.sqrt(phi * e) >= EVENT_Z for g, e, won in s["ev"])
                  if (s["wins"] >= WEEK_WINS and z >= WEEK_Z) or one_day: out.append({"a": a, "q": js_round((s["got"] / s["exp"]) * 1000) / 1000, "wins": s["wins"], "events": s["events"]})
              return out
          lw = now_w - 1
          flags = watch_week(lw_days)
          lw_changed = any(day in pub and inc[day] != pub[day] or day not in pub for day, j in inc.items() if j["week"] == lw)
          pub_hold = show("lastnode/vault/HOLD-W%d.json" % lw) is not None
          lines = []
          vd = os.path.join(d, "vault")
          vnames = sorted(os.listdir(vd)) if os.path.isdir(vd) else []
          inc_hold = "HOLD-W%d.json" % lw in vnames
          for f in vnames:
              j = json.load(open(os.path.join(vd, f), encoding="utf-8"))
              if j["week"] != lw: continue                                                   # the shape check refuses these
              if f.startswith("HOLD-"):
                  # L-8: a hold file says exactly which nodes the rule flags; a week released by the owner needs none.
                  if lw in released or not flags or j["nodes"] != flags: lines.append("%s bad" % f); print("::error::vault/%s isn't what watch-and-hold gives for last week's day files" % f)
                  else: lines.append("%s ok" % f)
                  continue
              if not final: lines.append("%s hold" % f); continue
              # Two runs (fix-check N-1/N-3): a vault file is published only after last week's final board and day files are
              # already on games-data, unchanged by this run, so one bad run can't add hours and file the week together.
              if not (pb and pb.get("final")) or lw_changed: lines.append("%s hold" % f); continue
              # N-9: a week the rule flags, or one already held on games-data, isn't filed until the owner releases it.
              if lw not in released and (flags or pub_hold or inc_hold): lines.append("%s held" % f); continue
              listed = {x["player"] for x in j["rows"]}
              scoring = {r["a"] for r in want if r["pts"] >= 1}
              # No rows while the week has scoring players: the stakes may not have been read (audit LN-2). Not published; the
              # recorder tries again next run (the Vault keeps the bucket in the game if no file comes).
              if not listed and scoring: lines.append("%s empty" % f); continue
              exp = vault_scores([r for r in want if r["a"] in listed])                       # LNF-1: points, not only order
              if not listed <= scoring or j["rows"] != exp: lines.append("%s bad" % f); print("::error::vault/%s: its rows aren't what last week's day files give" % f)
              else: lines.append("%s ok" % f)
          # LNF-12: the Vault's 3 days end with no file while the week had scoring players: say so (the run fails at the end).
          ws = WEEK0 + now_w * WEEK
          if ws + 3 * DAY <= now < ws + 3 * DAY + 2 * H and any(r["pts"] >= 1 for r in want) and parent and show("lastnode/vault/W%d.json" % (now_w - 1)) is None and "W%d.json ok" % (now_w - 1) not in lines:   # L-6
              lines.append("W%d.json unfiled" % (now_w - 1))
          open(status, "w").write("".join(x + "\n" for x in lines))
          for e in errs: print("::error::" + e)
          sys.exit(1 if errs else 0)
          HIST
          now_ms=${KG_TEST_NOW:-$(date +%s%3N)}
          # The race cards, to check each window's lowered multipliers (fix-check LNF-3).
          mkdir -p race
          # Fix-check I-9: the tests' race folder only with the tests' clock (never in a real run).
          if [ -n "${FAKE_RACE:-}" ] && [ -n "${KG_TEST_NOW:-}" ]; then cp "$FAKE_RACE"/W*.json race/ 2>/dev/null || true
          elif git ls-remote --exit-code --heads "$remote" race-data >/dev/null 2>&1; then
            git init -q racegit && git -C racegit fetch -q --depth 1 "$remote" race-data
            for f in $(git -C racegit ls-tree --name-only FETCH_HEAD); do if [[ "$f" =~ ^W[0-9]{3}\.json$ ]]; then git -C racegit show "FETCH_HEAD:$f" > "race/$f"; fi; done
          else
            rc=$?
            if [ "$rc" -ne 2 ]; then echo "::error::Couldn't read the race-data branch (git exit $rc); not publishing this run."; exit 1; fi
          fi
          git init -q work && cd work
          export GIT_AUTHOR_NAME=kpred-bot GIT_AUTHOR_EMAIL=kpred-bot@users.noreply.github.com GIT_COMMITTER_NAME=kpred-bot GIT_COMMITTER_EMAIL=kpred-bot@users.noreply.github.com
          # Other games publish to the same branch: if a push loses the race, take the new branch tip and try again.
          for try in 1 2 3; do
            parent=""
            if git fetch -q --depth 1 "$remote" games-data 2>/dev/null; then
              parent=$(git rev-parse FETCH_HEAD)
              git read-tree FETCH_HEAD
            else git read-tree --empty; fi
            # The day list only ever grows: a run that lost track of earlier days is refused.
            if [ -n "$parent" ] && git cat-file -e "$parent:lastnode/index.json" 2>/dev/null; then
              git show "$parent:lastnode/index.json" > ../old-index.json
              /usr/bin/python3 -c 'import json,sys; o=set(json.load(open(sys.argv[1])).get("days") or []); n=set(json.load(open(sys.argv[2]))["days"]); missing=sorted(o-n); sys.exit("::error::Refusing to publish: days missing from index.json: %s" % missing[:10]) if missing else None' ../old-index.json "$IN/lastnode/index.json"
            fi
            if ! /usr/bin/python3 -I ../histcheck.py "$parent" "$IN/lastnode" "$now_ms" ../vault-status.txt ../race; then echo "::error::Refusing to publish this run: its files break the rules or change published history."; exit 1; fi
            for f in "$IN"/lastnode/*.json; do
              blob=$(git hash-object -w "$f")
              git update-index --add --cacheinfo 100644 "$blob" "lastnode/$(basename "$f")"
            done
            # A vault file is final: once published it is never replaced (the Vault posts it within the hour). Audit LN-1: a
            # different copy is an error you are told about (the run fails after publishing the rest).
            differs=""; vbad=""
            held=""; heldw=""
            # Watch-and-hold: the hold file only when histcheck.py's own watch-and-hold gives exactly it (fix-check L-8).
            for f in "$IN"/lastnode/vault/HOLD-W*.json; do
              [ -e "$f" ] || continue
              name="lastnode/vault/$(basename "$f")"
              st=$(grep -E "^$(basename "$f") " ../vault-status.txt | cut -d' ' -f2 || true)
              if [ "$st" != ok ]; then vbad="$vbad $name"; continue; fi
              # Told once, when the hold is first published (not on every run while it waits for your review).
              if [ -n "$parent" ] && git cat-file -e "$parent:$name" 2>/dev/null; then echo "::warning::$name is still waiting for your review."; continue; fi
              blob=$(git hash-object -w "$f"); git update-index --add --cacheinfo 100644 "$blob" "$name"; held="$held $(basename "$f")"
            done
            for f in "$IN"/lastnode/vault/W*.json; do
              [ -e "$f" ] || continue
              name="lastnode/vault/$(basename "$f")"
              if grep -qxF "$(basename "$f")" "$RUNNER_TEMP/vault-skip.txt"; then echo "::warning::$name arrived after the Vault's 3 days; not published."; continue; fi
              blob=$(git hash-object -w "$f")
              if [ -n "$parent" ] && old=$(git rev-parse -q --verify "$parent:$name" 2>/dev/null); then
                if [ "$old" != "$blob" ]; then differs="$differs $name"; fi
                continue
              fi
              # First publish of this week's file: histcheck.py compared it with last week's day files.
              st=$(grep -E "^$(basename "$f") " ../vault-status.txt | cut -d' ' -f2 || true)
              case "$st" in
                ok) git update-index --add --cacheinfo 100644 "$blob" "$name" ;;
                hold) echo "Holding $name until last week's final board is published and unchanged (next run)." ;;
                held) heldw="$heldw $name" ;;
                empty) echo "::warning::$name has no rows while last week has scoring players; not published (tried again next run)." ;;
                *) vbad="$vbad $name" ;;
              esac
            done
            tree=$(git write-tree)
            if [ -n "$parent" ] && [ "$tree" = "$(git rev-parse "$parent^{tree}")" ]; then echo "No changes."; nochange=1; break; fi
            commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "games: last node standing")
            if git push -q "$remote" "$commit:refs/heads/games-data"; then break; fi
            if [ "$try" = 3 ]; then echo "::error::Couldn't push games-data after 3 tries."; exit 1; fi
            sleep $((try * 5))
          done
          # Fix-check LNF-5 / L-7: what was left out is reported together, and the run fails once, at the end.
          fail=""
          if [ -n "$vbad" ]; then echo "::error::Not published: a vault or hold file doesn't match last week's day files:$vbad"; fail=1; fi
          if grep -q " unfiled$" ../vault-status.txt 2>/dev/null; then echo "::error::The Vault's 3 days for last week are over and no vault file was published (the week's bucket stays in the game). Check the recorder."; fail=1; fi
          if [ -n "${big:-}" ]; then echo "::error::Left out (over 2 MB): $big"; fail=1; fi
          if [ -n "${held:-}" ]; then echo "::error::Last week's vault file is HELD for your review:$held (see it on games-data). After reviewing, release it with: gh variable set LASTNODE_RELEASE_WEEKS --body \"<week>\""; fail=1; fi
          if [ -n "${heldw:-}" ]; then echo "::error::Not published: watch-and-hold flags last week (or it is held on games-data) and it isn't released:$heldw. After reviewing, release it with: gh variable set LASTNODE_RELEASE_WEEKS --body \"<week>\""; fail=1; fi
          if [ -n "$differs" ]; then echo "::error::Already published, and this run's copy is DIFFERENT (kept the published one; check it before the Vault seals):$differs"; fail=1; fi
          if [ -n "$fail" ]; then exit 1; fi
          [ -n "${nochange:-}" ] || echo "Last Node Standing files published."
