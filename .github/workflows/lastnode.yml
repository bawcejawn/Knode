          def window_on(url, t0, t1, frm, to):
              """The recorded window [frm, to] for [t0, t1): its boundary blocks and each signer's count, on one node."""
              bs = blocks(url, max(1, frm - 1), to + 1)
              inside = [x for x in bs if frm <= x[0] <= to]
              if frm > 1 and not bs[0][2] < t0: return None, "block %d (before the window) isn't before its start" % (frm - 1)
              if not inside or inside[0][2] < t0 or inside[-1][2] >= t1: return None, "blocks %d-%d aren't all inside the window" % (frm, to)
              if not bs[-1][2] >= t1: return None, "block %d (after the window) isn't at or after its end" % (to + 1)
              counts = {}
              for _, s, _t in inside: counts[s] = counts.get(s, 0) + 1
