# The operator bot, run by GitHub every hour for free. It does whatever is due (resolve finished questions,
# post the day's questions, close / finalize weeks, settle players, compound) and publishes game-data/ so every
# question and result is public. Safe to run any number of times.
#
# Two jobs, so the bot never holds a token that can change the repository:
#   tick     runs the bot with OPERATOR_WIF. Its GitHub token is read-only and is not left in .git/config;
#            npm installs exactly package-lock.json with install scripts off. It hands game-data/ on as an artifact.
#   publish  runs no repository code. It copies only the bot's public files (questions, bot-state, state, index)
#            into game-data/, refuses anything else, and pushes them. It is the only place with a write token.
#
# It does not run on pull requests. A pull request must never see OPERATOR_WIF and must never push to main.
# "Run workflow" uses the chosen branch's copy of this file, so the key is kept in a GitHub environment that only main
# may use (the ref check below is a second guard, but a branch could edit it away; the environment rule it cannot).
#
# Turn it on:
#   Settings → Environments → New environment "bot" → Deployment branches and tags: "Selected", add the rule "main".
#     Environment secrets: OPERATOR_WIF   the bot's key (it can only post and resolve questions — never move funds)
#     (Delete any repository-level OPERATOR_WIF secret, so only the environment holds it.)
#   Settings → Secrets and variables → Actions → Variables: BOT_ENABLED = true   (RPC is optional; defaults to https://api.koinos.io)
name: Kpred bot

on:
  schedule:
    - cron: "7 * * * *"      # every hour at minute 7
  workflow_dispatch: {}       # "Run workflow" button for a manual run

concurrency:
  group: kpred-bot            # never two bots at once
  cancel-in-progress: false

permissions:
  contents: read              # the bot job can only read; only the publish job below can push

jobs:
  # The block history cache is restored here, in a job with no secrets and no write token, and runs no repository code
  # after the restore. A poisoned cache could otherwise plant files in the job that holds the operator key (audit H-1).
  blocks-in:
    if: ${{ vars.BOT_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: game-data/blocks.csv
          key: blocks-${{ github.run_id }}
          restore-keys: blocks-
      - name: Check the block history (format only; the bot spot-checks it against the chain)
        run: |
          set -euo pipefail
          f="${BLOCKS_FILE:-game-data/blocks.csv}"
          if [ ! -f "$f" ] || [ -L "$f" ]; then echo "No block history yet."; rm -f "$f"; exit 0; fi
          if /usr/bin/python3 - "$f" <<'PY'
          import re, sys, os
          f = sys.argv[1]
          if os.path.getsize(f) > 200 * 1024 * 1024: sys.exit("block history over 200 MB")
          row = re.compile(r"^\d{1,10},\d{1,15},(1[1-9A-HJ-NP-Za-km-z]{25,34}|unknown),\d{1,6},\d{1,15}$")
          prev = None
          with open(f, encoding="ascii") as fh:
              for n, line in enumerate(fh.read().split("\n"), 1):
                  if not line: continue
                  if not row.match(line): sys.exit(f"bad row {n}")
                  h = int(line.split(",", 1)[0])
                  if prev is not None and h != prev + 1: sys.exit(f"gap at row {n}")
                  prev = h
          print("block history ok")
          PY
          then :; else echo "::warning::Block history failed the format check; the bot downloads it again."; rm -f "$f"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blocks-in
          path: game-data/blocks.csv
          retention-days: 1
          if-no-files-found: ignore

  tick:
    needs: blocks-in
    if: ${{ always() && vars.BOT_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    environment: bot          # holds OPERATOR_WIF; its deployment-branch rule allows main only
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      start: ${{ steps.start.outputs.sha }}
    steps:
      # The branch head as it is now, not the commit the run was created for: a run queued behind a long one (or a
      # "Run workflow" click during a run) must see the previous run's published files.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - id: start
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Exactly package-lock.json, and no package's install script runs next to the bot key.
      - run: npm ci --no-audit --no-fund --ignore-scripts
      # The block history from the job above: unpacked outside the repository, checked again, and only blocks.csv is used.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: blocks-in
          path: ${{ runner.temp }}/blocks-in
      - name: Check and take the block history
        env:
          BLOCKS_FILE: ${{ runner.temp }}/blocks-in/blocks.csv
        run: |
          set -euo pipefail
          f="${BLOCKS_FILE:-game-data/blocks.csv}"
          if [ ! -f "$f" ] || [ -L "$f" ]; then echo "No block history yet."; rm -f "$f"; exit 0; fi
          if /usr/bin/python3 - "$f" <<'PY'
          import re, sys, os
          f = sys.argv[1]
          if os.path.getsize(f) > 200 * 1024 * 1024: sys.exit("block history over 200 MB")
          row = re.compile(r"^\d{1,10},\d{1,15},(1[1-9A-HJ-NP-Za-km-z]{25,34}|unknown),\d{1,6},\d{1,15}$")
          prev = None
          with open(f, encoding="ascii") as fh:
              for n, line in enumerate(fh.read().split("\n"), 1):
                  if not line: continue
                  if not row.match(line): sys.exit(f"bad row {n}")
                  h = int(line.split(",", 1)[0])
                  if prev is not None and h != prev + 1: sys.exit(f"gap at row {n}")
                  prev = h
          print("block history ok")
          PY
          then :; else echo "::warning::Block history failed the format check; the bot downloads it again."; rm -f "$f"; fi
      - run: if [ -f "$RUNNER_TEMP/blocks-in/blocks.csv" ]; then mkdir -p game-data && cp "$RUNNER_TEMP/blocks-in/blocks.csv" game-data/blocks.csv; fi
      - name: Run the bot
        run: npm run bot -- tick
        env:
          OPERATOR_WIF: ${{ secrets.OPERATOR_WIF }}
          RPC: ${{ vars.RPC || 'https://api.koinos.io' }}
          # A second, independent node: results are posted only when both agree on the window's blocks (audit M-9).
          RPC_CHECK: ${{ vars.RPC_CHECK }}
          GEN_DIR: game-data
          BOT_GIT_PUSH: "1"
      # Even when the run failed (it emails you), whatever it posted must still become public.
      - name: Hand the public files to the publish job
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: game-data
          path: |
            game-data/questions/
            game-data/bot-state.json
            game-data/state.json
            game-data/index.json
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: blocks-out
          path: game-data/blocks.csv
          retention-days: 1
          if-no-files-found: ignore

  # Saving a cache runs nothing from it. The cache path stays game-data/blocks.csv so earlier caches keep matching.
  blocks-out:
    needs: tick
    if: ${{ always() && vars.BOT_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        id: dl
        continue-on-error: true
        with:
          name: blocks-out
          path: game-data
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ steps.dl.outcome == 'success' && hashFiles('game-data/blocks.csv') != '' }}
        with:
          path: game-data/blocks.csv
          key: blocks-${{ github.run_id }}

  publish:
    needs: tick
    if: ${{ always() && vars.BOT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write         # push game-data/ (questions, results, bot state)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true    # no artifact: nothing to publish
        with:
          name: game-data
          path: ${{ runner.temp }}/incoming
      - name: Push game-data/ (and nothing else)
        env:
          GH_TOKEN: ${{ github.token }}
          IN: ${{ runner.temp }}/incoming
          START_SHA: ${{ needs.tick.outputs.start }}
        run: |
          set -euo pipefail
          if [ ! -d "$IN" ]; then echo "Nothing to publish."; exit 0; fi
          # Only the bot's own public files, as plain JSON files: no links, nothing outside these paths.
          bad=$(find "$IN" -mindepth 1 \( -type l -o \( -type f ! -regex "$IN/\(questions/[A-Za-z0-9_-]*\.json\|bot-state\.json\|state\.json\|index\.json\)" \) \) -print)
          if [ -n "$bad" ]; then echo "::error::Refusing to publish unexpected files: $bad"; exit 1; fi
          # Real files are a few KB: refuse anything over 2 MB.
          big=$(find "$IN" -type f -size +2048k -print)
          if [ -n "$big" ]; then echo "::error::Refusing to publish files over 2 MB: $big"; exit 1; fi
          find "$IN" -type f -name '*.json' -print0 | xargs -0 -r -n1 node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))'
          # The content must look like the bot's own files, not only parse as JSON.
          node - "$IN" <<'JS'
          const fs = require("fs"), path = require("path");
          const IN = process.argv[2], bad = [];
          const read = (rel) => JSON.parse(fs.readFileSync(path.join(IN, rel), "utf8"));
          const isObj = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
          const hex = (v, n) => typeof v === "string" && new RegExp(`^(0x)?[0-9a-fA-F]{${n}}$`).test(v);
          const qdir = path.join(IN, "questions");
          for (const f of fs.existsSync(qdir) ? fs.readdirSync(qdir) : []) {
            const d = read("questions/" + f), rel = "questions/" + f;
            if (!isObj(d) || !Array.isArray(d.questions) || (d.date !== undefined && typeof d.date !== "string") || (d.week !== undefined && !Number.isInteger(d.week)) || (d.day !== undefined && !Number.isInteger(d.day))) { bad.push(`${rel}: not a question day file`); continue; }
            if (d.questions.length > 50) bad.push(`${rel}: ${d.questions.length} questions`);
            for (const q of d.questions) {
              if (!isObj(q) || typeof q.id !== "string" || !/^[A-Za-z0-9_-]{1,40}$/.test(q.id)) { bad.push(`${rel}: a question without a valid id`); continue; }
              if (q.paramsHash !== undefined && !hex(q.paramsHash, 64)) bad.push(`${rel} ${q.id}: paramsHash`);
              if (q.options !== undefined && (!Array.isArray(q.options) || q.options.length < 2 || q.options.length > 12)) bad.push(`${rel} ${q.id}: options`);
              if (q.chainId !== undefined && !(Number.isInteger(q.chainId) && q.chainId >= 0 && q.chainId < 2 ** 32)) bad.push(`${rel} ${q.id}: chainId`);
              if (q.text !== undefined && (typeof q.text !== "string" || q.text.length > 2000)) bad.push(`${rel} ${q.id}: text`);
              if (JSON.stringify(q).length > 200000) bad.push(`${rel} ${q.id}: too large`);
            }
          }
          if (fs.existsSync(path.join(IN, "bot-state.json"))) { const b = read("bot-state.json"); if (!isObj(b) || (b.seal !== undefined && !hex(b.seal, 64))) bad.push("bot-state.json: not the bot's state"); }
          if (fs.existsSync(path.join(IN, "state.json")) && !isObj(read("state.json"))) bad.push("state.json: not an object");
          if (fs.existsSync(path.join(IN, "index.json"))) {
            const x = read("index.json");
            if (!isObj(x) || !Array.isArray(x.days) || x.days.some((d) => typeof d !== "string" || !/^questions\/[A-Za-z0-9_-]+\.json$/.test(d))) bad.push("index.json: days");
          }
          if (bad.length) { console.log(`::error::Refusing to publish: ${bad.slice(0, 10).join("; ")}`); process.exit(1); }
          JS
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # The commit the tick job started from. The bot's files are written on top of the LATEST main, so every other
          # commit made during the run (your edits to deployment.json, game.json, ...) is kept as it is. A bot file that
          # also changed on main since that commit is merged three ways (that commit's copy, main's, this run's), field by
          # field: a field only main changed keeps main's value, a field only this run changed keeps the run's, and where
          # both changed it main wins (lists of VHP readings and corrections are joined). This run's question records
          # (a question, its chain id, its result) are added, never dropped.
          start="${START_SHA:-${GITHUB_SHA:-$(git rev-parse HEAD)}}"
          for attempt in 1 2 3 4 5; do
            git cat-file -e "$start^{commit}" 2>/dev/null || git fetch -q "$remote" "$start" 2>/dev/null || true
            git fetch -q "$remote" "$GITHUB_REF_NAME"
            git reset -q --hard FETCH_HEAD
            changed=$(git diff --name-only "$start" HEAD -- game-data/ 2>/dev/null || echo "__all__")
            CHANGED="$changed" START="$start" node - "$IN" game-data <<'JS'
          const fs = require("fs"), path = require("path"), { execFileSync } = require("child_process");
          const [IN, OUT] = process.argv.slice(2);
          const changed = new Set(String(process.env.CHANGED || "").split("\n").filter(Boolean));
          const onMain = (rel) => changed.has("__all__") || changed.has("game-data/" + rel);
          const read = (f) => JSON.parse(fs.readFileSync(f, "utf8"));
          const write = (f, v) => { fs.mkdirSync(path.dirname(f), { recursive: true }); fs.writeFileSync(f, JSON.stringify(v, null, 2) + "\n"); };
          const copy = (rel) => { fs.mkdirSync(path.dirname(path.join(OUT, rel)), { recursive: true }); fs.copyFileSync(path.join(IN, rel), path.join(OUT, rel)); };
          const union = (a, b) => { const seen = new Set(a.map((x) => JSON.stringify(x))); return [...a, ...b.filter((x) => !seen.has(JSON.stringify(x)))]; };
          const key = (q) => (q && typeof q.id === "string" ? "id:" + q.id : "json:" + JSON.stringify(q));
          const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
          const isObj = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
          /** The file as it was when the run started (null if it did not exist or cannot be read). */
          const baseOf = (rel) => { try { return JSON.parse(execFileSync("git", ["show", `${process.env.START}:game-data/${rel}`], { encoding: "utf8", stdio: ["ignore", "pipe", "ignore"] })); } catch { return null; } };
          /** Field by field: main's value where only main changed it, the run's where only the run did; main's on a clash
           *  (joined for the lists below). Without a base copy, main's value wins for every field both have. */
          function merge3(base, m, r, lists = []) {
            const out = {};
            for (const k of new Set([...Object.keys(m), ...Object.keys(r)])) {
              const bv = isObj(base) ? base[k] : undefined, mv = m[k], rv = r[k];
              let v;
              if (!(k in r)) v = mv;
              else if (!(k in m)) v = isObj(base) && k in base ? undefined : rv;   // deleted on main: stays deleted
              else if (isObj(base) && same(mv, bv)) v = rv;
              else if (isObj(base) && same(rv, bv)) v = mv;
              else if (lists.includes(k) && (Array.isArray(mv) || Array.isArray(rv))) v = union(Array.isArray(mv) ? mv : [], Array.isArray(rv) ? rv : []);
              else v = mv;
              if (v !== undefined) out[k] = v;
            }
            return out;
          }
          function mergeDay(base, m, b) {
            const out = merge3(base, m, b);
            const mq = Array.isArray(m.questions) ? m.questions : [], bq = Array.isArray(b.questions) ? b.questions : [];
            const byKey = new Map(bq.map((q) => [key(q), q]));
            const baseQ = new Map((isObj(base) && Array.isArray(base.questions) ? base.questions : []).map((q) => [key(q), q]));
            out.questions = mq.map((q) => {
              const x = byKey.get(key(q));
              if (!isObj(x) || !isObj(q)) return q;
              const out = merge3(baseQ.get(key(q)), q, x, ["corrections"]);
              // Only the bot writes VHP readings, and their seal covers the whole list: this run's list and seal are
              // published together, never joined with main's (a joined list breaks the seal and holds the question).
              if ("vhpReadings" in x || "vhpSeal" in x) { out.vhpReadings = x.vhpReadings; out.vhpSeal = x.vhpSeal; }
              return out;
            });
            const have = new Set(mq.map(key));
            for (const q of bq) if (!have.has(key(q))) out.questions.push(q);
            return out;
          }
          const qdir = path.join(IN, "questions");
          for (const f of fs.existsSync(qdir) ? fs.readdirSync(qdir).filter((n) => /^[A-Za-z0-9_-]*\.json$/.test(n)) : []) {
            const rel = "questions/" + f, dst = path.join(OUT, rel);
            if (!onMain(rel) || !fs.existsSync(dst)) { copy(rel); continue; }
            write(dst, mergeDay(baseOf(rel), read(dst), read(path.join(IN, rel))));
            console.log(`::warning::game-data/${rel} was also changed on main during this run: merged main's changes with this run's.`);
          }
          // bot-state.json and state.json are the bot's own bookkeeping: this run's copy is the newest.
          for (const rel of ["bot-state.json", "state.json"]) if (fs.existsSync(path.join(IN, rel))) {
            if (onMain(rel) && fs.existsSync(path.join(OUT, rel))) console.log(`::warning::game-data/${rel} was also changed on main during this run: this run's copy is published.`);
            copy(rel);
          }
          if (fs.existsSync(path.join(IN, "index.json"))) {
            const b = read(path.join(IN, "index.json")), dst = path.join(OUT, "index.json");
            const m = fs.existsSync(dst) ? read(dst) : {};
            const days = union(Array.isArray(m.days) ? m.days : [], Array.isArray(b.days) ? b.days : []).filter((d) => typeof d === "string").sort();
            write(dst, { ...m, ...b, days });
          }
          JS
            for p in game-data/questions game-data/bot-state.json game-data/state.json game-data/index.json; do
              if [ -e "$p" ]; then git add -- "$p"; fi
            done
            if git diff --cached --quiet; then echo "No changes."; exit 0; fi
            # A run changes a handful of files (today's questions, results, bot state): refuse a flood.
            n=$(git diff --cached --name-only | wc -l)
            if [ "$n" -gt 50 ]; then echo "::error::Refusing to publish $n changed files in one run (at most 50)."; exit 1; fi
            outside=$(git diff --cached --name-only | grep -Ev '^game-data/(questions/[A-Za-z0-9_-]+\.json|bot-state\.json|state\.json|index\.json)$' || true)
            if [ -n "$outside" ]; then echo "::error::Refusing to publish: $outside"; exit 1; fi
            git -c user.name="kpred-bot" -c user.email="kpred-bot@users.noreply.github.com" commit -q -m "bot: tick"
            if git push -q "$remote" "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            echo "Push attempt $attempt failed; retrying."; sleep $((attempt * 5))
          done
          echo "::error::Could not push game-data/."; exit 1
