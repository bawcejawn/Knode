# On every push and every pull request that touches the desk: build the contract, run its tests, and run the offline safety check.
name: Desk contract tests

on:
  push:
    paths: ["desk/**", ".github/workflows/desk-test.yml"]
  pull_request:
    paths: ["desk/**", ".github/workflows/desk-test.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: npm test
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
      - name: Show what failed (as annotations on the run page)
        if: failure()
        run: |
          sed 's/\x1b\[[0-9;]*m//g' test.log | grep -E "❌|\[Actual\]|\[Expected\]|ERROR|Error|error|Tests\]" | head -40 | while IFS= read -r l; do echo "::error::$l"; done
      - name: npm run check
        run: |
          set -o pipefail
          npm run check 2>&1 | tee check.log
      # A short summary on the run page (readable without opening the logs).
      - name: Summary
        if: always()
        run: |
          strip() { sed 's/\x1b\[[0-9;]*m//g' "$1" 2>/dev/null; }
          echo "::notice title=Tests::$(strip test.log | grep -E '\[(Groups|Result|Tests|Files)\]' | tr -s ' ' | tr '\n' ' ')"
          echo "::notice title=Offline check::$(strip check.log | grep -cE '^PASS') PASS, $(strip check.log | grep -cE '^FAIL') FAIL — $(strip check.log | grep -E 'contract size' | head -1)"
          strip check.log | grep -E '^FAIL' | while IFS= read -r l; do echo "::error title=Offline check::$l"; done
          sha=$(sha256sum build/release/contract.wasm 2>/dev/null | cut -d' ' -f1); echo "::notice title=Release build sha256::$sha"
