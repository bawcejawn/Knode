# KnodeGames recorders: every hour, records each game's results from the chain (irreversible blocks only, two nodes
# must agree). Today: Who Signs Block X (bot/games/blockx.ts) and Survivor (bot/games/survivor.ts). Each game has its
# own folder on the games-data branch.
#
# Two jobs, like the race and the main bot, so repository code never runs next to a write token:
#   record   runs the recorders with a read-only token and no secrets (they only read the chain), and hands the files on.
#   publish  runs no repository code: it checks the files' shape and pushes them to the games-data branch.
# It never touches main, holds no key, and does not run on pull requests.
#
# Turn it on: Settings → Secrets and variables → Actions → Variables: GAMES_ENABLED = true
name: KnodeGames recorders

on:
  schedule:
    - cron: "47 * * * *"     # every hour at minute 47 (after the race recorder at :37 has taken the hour's card)
  workflow_dispatch: {}

concurrency:
  group: knode-games
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  record:
    if: ${{ vars.GAMES_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund --ignore-scripts
      # The files the last run published, and the race recorder's cards (public branches; read without a token).
      # Only plain JSON files with the expected names are taken.
      - name: Take the last run's files and the race cards
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prev/blockx" "$RUNNER_TEMP/prev/survivor" "$RUNNER_TEMP/race"
          # A games-data branch that exists but can't be fetched stops the run: starting from nothing would publish
          # regressed files over the good ones (Repo Lense S2-15). ls-remote exits 2 when the branch doesn't exist.
          has=0; git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" games-data >/dev/null 2>&1 || has=$?
          if [ "$has" = 0 ]; then
            git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" games-data
            # (audit BX-34: names read line by line, never word-split; only expected names are taken)
            git ls-tree --name-only FETCH_HEAD:blockx 2>/dev/null | while IFS= read -r f; do
              if [[ "$f" =~ ^(index|board|W[0-9]{3}|P[0-9]{3})\.json$ ]]; then git show "FETCH_HEAD:blockx/$f" > "$RUNNER_TEMP/prev/blockx/$f"; fi
            done
            git ls-tree --name-only FETCH_HEAD:survivor 2>/dev/null | while IFS= read -r f; do
              if [[ "$f" =~ ^(index|days|fields|S[0-9]{3,4})\.json$ ]]; then git show "FETCH_HEAD:survivor/$f" > "$RUNNER_TEMP/prev/survivor/$f"; fi
            done
          elif [ "$has" = 2 ]; then echo "No games-data branch yet."
          else echo "::error::Couldn't reach the games-data branch; not recording this run"; exit 1; fi
          if git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" race-data 2>/dev/null; then
            git ls-tree --name-only FETCH_HEAD | while IFS= read -r f; do
              if [[ "$f" =~ ^W[0-9]{3}\.json$ ]]; then git show "FETCH_HEAD:$f" > "$RUNNER_TEMP/race/$f"; fi
            done
          else echo "No race-data branch yet: targets wait for cards."; fi
      - name: Record Who Signs Block X
        run: npm run blockx
        env:
          RPC: ${{ vars.RPC || 'https://koinos.armana.io' }}
          RPC_CHECK: ${{ vars.RPC_CHECK || 'https://api.koinosblocks.com' }}
          BLOCKX_PREV: ${{ runner.temp }}/prev/blockx
          BLOCKX_OUT: ${{ runner.temp }}/games-data/blockx
          RACE_DATA: ${{ runner.temp }}/race
      # Survivor runs even if Block X failed this hour, and the files of whichever recorder worked are published.
      - name: Record Survivor
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: npm run survivor
        env:
          RPC: ${{ vars.RPC || 'https://koinos.armana.io' }}
          RPC_CHECK: ${{ vars.RPC_CHECK || 'https://api.koinosblocks.com' }}
          SURVIVOR_PREV: ${{ runner.temp }}/prev/survivor
          SURVIVOR_OUT: ${{ runner.temp }}/games-data/survivor
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: games-data
          path: ${{ runner.temp }}/games-data/
          retention-days: 1
          if-no-files-found: ignore

  publish:
    needs: record
    # Runs even when one recorder failed, so the other game's files still go out (audit SV-8); a failed recorder still
    # fails its job (and the run), which sends the usual alert.
    if: ${{ !cancelled() && vars.GAMES_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write         # push the games-data branch (never main)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: games-data
          path: ${{ runner.temp }}/incoming
      - name: Push games-data (and nothing else)
        env:
          GH_TOKEN: ${{ github.token }}
          IN: ${{ runner.temp }}/incoming
        run: |
          set -euo pipefail
          if [ ! -d "$IN" ]; then echo "Nothing to publish."; exit 0; fi
          bad=$(find "$IN" -mindepth 1 \( -type l -o \( -type d ! -path "$IN/blockx" ! -path "$IN/blockx/vault" ! -path "$IN/survivor" ! -path "$IN/survivor/vault" \) -o \( -type f ! -regex "$IN/blockx/\(index\|board\|W[0-9][0-9][0-9]\|P[0-9][0-9][0-9]\)\.json" ! -regex "$IN/blockx/vault/W[0-9][0-9]*\.json" ! -regex "$IN/survivor/\(index\|days\|fields\|S[0-9][0-9][0-9][0-9]?\)\.json" ! -regex "$IN/survivor/vault/W[0-9][0-9]*\.json" \) \) -print)
          if [ -n "$bad" ]; then echo "::error::Refusing to publish unexpected files: $bad"; exit 1; fi
          # Block X: a file over 2 MB stops the run. Survivor: that file alone is left out, and the run fails at the end
          # (Repo Lense SV-A5).
          failed=0
          drop() { echo "::error::Not publishing $1 this run: $2"; rm -rf "${IN:?}/$1"; failed=1; }
          big=$(find "$IN" -path "$IN/survivor" -prune -o -type f -size +2048k -print)
          if [ -n "$big" ]; then echo "::error::Refusing to publish files over 2 MB: $big"; exit 1; fi
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            echo "::error::Not publishing $f this run: over 2 MB (the published copy stays as it was)"; rm -f "$f"; failed=1
          done < <(if [ -d "$IN/survivor" ]; then find "$IN/survivor" -type f -size +2048k -print; fi)
          # The content must be the recorder's own shape, not only parse as JSON.
          if [ -d "$IN/blockx" ]; then /usr/bin/python3 - "$IN/blockx" 2 <<'PY'
          import json, os, re, sys
          d = sys.argv[1]; gid = int(sys.argv[2]); addr = re.compile(r"1[1-9A-HJ-NP-Za-km-z]{25,34}")
          iso = re.compile(r"\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(\.\d{3})?Z"); ymd = re.compile(r"\d{4}-\d\d-\d\d")
          num = lambda x: type(x) in (int, float) and x == x and abs(x) < 1e16
          nat = lambda x: type(x) is int and 0 <= x < 10**16
          WEEK = 7 * 86400000
          def target_ok(t):
              if type(t) is not dict or not set(t) <= {"round", "height", "final", "checked", "signer", "time", "lockTime", "card", "void", "picks"}: return False
              if not ({"round", "height", "final", "checked", "signer", "time", "lockTime", "card", "picks"} <= set(t)): return False
              if not (nat(t.get("round")) and nat(t.get("height")) and t["height"] >= t["round"] and t.get("final") is True and t.get("checked") in (0, 1, 2)): return False
              if not (t.get("signer") is None or addr.fullmatch(str(t["signer"]))) or not nat(t.get("time")) or not nat(t.get("lockTime")): return False
              c = t.get("card")
              if c is not None and (type(c) is not dict or set(c) not in ({"at", "top", "signerVhp"}, {"at", "top", "signerVhp", "afterAt"}) or not num(c["at"]) or not num(c["top"]) or not (c["signerVhp"] is None or num(c["signerVhp"])) or ("afterAt" in c and not (num(c["afterAt"]) and c["afterAt"] > c["at"]))): return False
              if "void" in t and (type(t["void"]) is not str or len(t["void"]) > 200): return False
              pk = t.get("picks")
              return type(pk) is list and len(pk) <= 100000 and all(type(x) is list and len(x) == 5 and addr.fullmatch(str(x[0])) and addr.fullmatch(str(x[1]))
                  and nat(x[2]) and type(x[3]) is int and 0 <= x[3] <= 300 and x[4] in (0, 1) for x in pk)
          def rows_ok(rows):
              return type(rows) is list and len(rows) <= 100000 and all(type(x) is dict and set(x) == {"a", "place", "boardPlace", "pts", "correct", "picks", "days", "lastCorrect", "ranked"} and addr.fullmatch(str(x["a"]))
                  and all(nat(x[k]) for k in ("place", "boardPlace", "pts", "correct", "picks", "days", "lastCorrect")) and type(x["ranked"]) is bool for x in rows)
          def prizes_ok(p):
              return type(p) is list and len(p) <= 50 and all(type(x) is dict and set(x) == {"player", "place", "vhp"} and addr.fullmatch(str(x["player"])) and nat(x["place"]) and num(x["vhp"]) and 0 < x["vhp"] <= 2 for x in p)
          def card_ok(c):
              if type(c) is not dict or set(c) != {"at", "blocksPerRace", "c", "fairness", "field", "paddock"} or not num(c["at"]) or not num(c["blocksPerRace"]) or not num(c["c"]): return False
              if not (c["fairness"] is None or (type(c["fairness"]) is list and len(c["fairness"]) == 2 and all(num(v) for v in c["fairness"]))): return False
              if type(c["field"]) is not list or type(c["paddock"]) is not list or len(c["field"]) + len(c["paddock"]) > 500: return False
              return all(type(r) is dict and set(r) == {"a", "vhp", "k", "h"} and addr.fullmatch(str(r["a"])) and all(num(r[k]) for k in ("vhp", "k", "h")) for r in c["field"]) and \
                  all(type(r) is dict and set(r) == {"a", "vhp", "k"} and addr.fullmatch(str(r["a"])) and all(num(r[k]) for k in ("vhp", "k")) for r in c["paddock"])
          def vault_ok(j, f):
              # The Vault (v6) results file: staked players' points (1-255) in rows, the free board's 1st and 2nd (at
              # most 10 per place); every wallet once.
              if type(j) is not dict or set(j) != {"game", "week", "final", "rows", "first", "second"} or j["game"] != gid or j["final"] is not True: return False
              if not nat(j["week"]) or f != "W%d.json" % j["week"]: return False
              rows = j["rows"]
              if type(rows) is not list or len(rows) > 100000 or not all(type(x) is dict and set(x) == {"player", "points"} and type(x["player"]) is str and addr.fullmatch(x["player"])
                  and type(x["points"]) is int and 1 <= x["points"] <= 255 for x in rows): return False
              w = j["first"] + j["second"] if type(j["first"]) is list and type(j["second"]) is list else None
              if w is None or len(j["first"]) > 10 or len(j["second"]) > 10 or not all(type(a) is str and addr.fullmatch(a) for a in w): return False
              allw = w + [x["player"] for x in rows]
              return len(set(allw)) == len(allw)
          if os.path.isdir(os.path.join(d, "vault")):
              for f in os.listdir(os.path.join(d, "vault")):
                  assert vault_ok(json.load(open(os.path.join(d, "vault", f), encoding="utf-8")), f), "vault/" + f
          for f in os.listdir(d):
              if f == "vault": continue
              j = json.load(open(os.path.join(d, f), encoding="utf-8"))
              if f == "board.json":
                  assert set(j) == {"v", "updated", "today", "week", "lastWeek", "allTime"} and j["v"] == 1 and iso.fullmatch(str(j["updated"])), f
                  assert type(j["today"]) is dict and set(j["today"]) == {"day", "rows"} and ymd.fullmatch(str(j["today"]["day"])) and rows_ok(j["today"]["rows"]), f
                  assert type(j["week"]) is dict and set(j["week"]) == {"week", "start", "rows"} and nat(j["week"]["week"]) and nat(j["week"]["start"]) and rows_ok(j["week"]["rows"]), f
                  assert type(j["allTime"]) is dict and set(j["allTime"]) == {"rows"} and rows_ok(j["allTime"]["rows"]), f
                  lw = j["lastWeek"]
                  assert lw is None or (type(lw) is dict and set(lw) in ({"week", "start", "final", "rows", "prizes"}, {"week", "start", "final", "rows", "prizes", "frozenAt"})
                      and nat(lw["week"]) and nat(lw["start"]) and type(lw["final"]) is bool and rows_ok(lw["rows"]) and prizes_ok(lw["prizes"])
                      and ("frozenAt" not in lw or iso.fullmatch(str(lw["frozenAt"])))), f
                  continue
              if f == "cards.json":
                  assert set(j) == {"v", "updated", "startHeight", "cards"} and j["v"] == 1 and iso.fullmatch(str(j["updated"])) and nat(j["startHeight"]), f
                  assert type(j["cards"]) is list and len(j["cards"]) <= 500 and all(card_ok(c) for c in j["cards"]), f
                  continue
              if f == "index.json":
                  assert set(j) == {"v", "updated", "weeks", "contract", "game", "prizesFromWeek"} and j["v"] == 1 and iso.fullmatch(str(j["updated"])), f
                  assert type(j["weeks"]) is list and len(j["weeks"]) <= 10000 and all(type(w) is int and 0 <= w < 10000 for w in j["weeks"]), f
                  assert j["game"] == gid and (j["prizesFromWeek"] is None or nat(j["prizesFromWeek"])), f
                  assert j["contract"] is None or addr.fullmatch(str(j["contract"])), f
                  continue
              if f.startswith("P"):
                  assert set(j) == {"v", "week", "game", "at", "prizes"} and j["v"] == 1 and j["game"] == gid and f == "P%03d.json" % j["week"], f
                  assert iso.fullmatch(str(j["at"])) and prizes_ok(j["prizes"]), f
                  continue
              assert set(j) == {"v", "week", "start", "end", "game", "targets"} and j["v"] == 1 and j["game"] == gid and f == "W%03d.json" % j["week"], f
              assert nat(j["start"]) and nat(j["end"]) and j["end"] - j["start"] == WEEK, f
              assert type(j["targets"]) is list and len(j["targets"]) <= 1000 and all(target_ok(t) for t in j["targets"]), f
          print("games files ok:", d)
          PY
          fi
          # Exit 3: everything checked out except vault files that couldn't be checked, which it removed (the run fails).
          rc=0
          if [ -d "$IN/survivor" ]; then /usr/bin/python3 -I - "$IN/survivor" <<'PY' || rc=$?
          # Shape AND meaning (Repo Lense SV-A4, SV-A13): integers are real integers in range, the result agrees with
          # itself, and prizes go only to eligible players in the season, once each, and only when the season is final.
          import json, os, re, sys
          d = sys.argv[1]; addr = re.compile(r"1[1-9A-HJ-NP-Za-km-z]{25,34}")
          def bad_constant(c): raise ValueError("not JSON: " + c)
          isaddr = lambda x: type(x) is str and addr.fullmatch(x) is not None
          iso = lambda x: type(x) is str and re.fullmatch(r"\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(\.\d{3})?Z", x) is not None
          num = lambda x: type(x) in (int, float) and x == x and abs(x) < 1e15
          nat = lambda x: type(x) is int and 0 <= x < 2**53
          day = lambda x: type(x) is int and 0 < x < 10**6
          small = lambda x, lo, hi: type(x) is int and lo <= x <= hi
          GENESIS_DAY = 20745   # Monday 19 Oct 2026, vault week 0
          week_of = lambda day: (day - GENESIS_DAY) // 7
          def counts_ok(c): return type(c) is list and len(c) <= 500 and all(type(x) is list and len(x) == 2 and isaddr(x[0]) and nat(x[1]) for x in c)
          def field_ok(f): return type(f) is list and len(f) <= 500 and all(type(x) is dict and set(x) == {"a", "k", "h"} and isaddr(x["a"]) and nat(x["k"]) and num(x["h"]) and x["h"] >= 1 for x in f)
          def player_ok(p, endN):
              if type(p) is not dict or set(p) != {"a", "lives", "outN", "total", "used", "log", "eligible", "staked", "place"} or type(p["staked"]) is not bool: return False
              if type(p["log"]) is not str or re.fullmatch(r"[sonfuv]{0,14}", p["log"]) is None or len(p["log"]) > endN: return False
              if not (isaddr(p["a"]) and small(p["lives"], 0, 2) and (p["outN"] is None or small(p["outN"], 1, 14)) and num(p["total"]) and p["total"] >= 0 and small(p["place"], 1, 100000) and type(p["eligible"]) is bool): return False
              if not (type(p["used"]) is list and len(p["used"]) <= 14 and all(isaddr(a) for a in p["used"]) and len(set(p["used"])) == len(p["used"])): return False
              # The log decides the rest: a life goes on o, n, f and u; out on the second.
              log, lost = p["log"], sum(p["log"].count(c) for c in "onfu")
              if p["lives"] != max(0, 2 - lost) or len(p["used"]) != sum(log.count(c) for c in "sov") or lost > 2: return False
              if p["outN"] is None: return lost < 2
              return lost == 2 and len(log) == p["outN"] and log[-1] in "onfu"
          # The season is played again here from its days, with the same rules as survivor-math.js (mainnet: 14
          # days, 2 lives, no out-zone floor), and the result must be exactly that (Repo Lense fix-check, SV-A4).
          import math
          def jsround(x): r = math.floor(x); return r + 1 if x - r >= 0.5 else r
          round4 = lambda x: jsround(x * 1e4) / 1e4
          def score_day(field, counts, n):
              got = {a: c for a, c in counts}
              rows = sorted(({"a": x["a"], "score": round4(got.get(x["a"], 0) * x["h"])} for x in field), key=lambda r: (-r["score"], r["a"]))
              o = (len(rows) * (12 + min(14, max(1, n)))) // 52
              if not o: return rows, set()
              line = sorted(r["score"] for r in rows)[o]
              return rows, {r["a"] for r in rows if r["score"] < line}
          def rank(players):
              key = lambda x: (math.inf if x["outN"] is None else x["outN"], x["lives"], x["total"])
              ps = sorted(players, key=lambda x: x["a"])
              ps.sort(key=key, reverse=True)
              out, place = [], 0
              for i, x in enumerate(ps):
                  if i == 0 or key(ps[i - 1]) != key(x): place = i + 1
                  out.append(dict(x, place=place))
              return out
          def play(days):
              if not days or days[0]["n"] != 1: return [], False, 0
              ps = {}
              for p, _ in days[0]["picks"]:
                  if p not in ps: ps[p] = {"a": p, "lives": 2, "outN": None, "t4": 0, "used": [], "log": "", "eligible": True}
              started, over, endN = len(ps), False, 0
              for i, day in enumerate(days):
                  if day["n"] != i + 1 or over: break
                  rows, out = score_day(day["field"], day["counts"], day["n"])
                  score = {r["a"]: r["score"] for r in rows}
                  pick = {}
                  for p, a in day["picks"]: pick[p] = a
                  novhp = set(day["noVhp"])
                  fate = []
                  for x in [x for x in ps.values() if x["outN"] is None]:
                      a = pick.get(x["a"])
                      code = "n" if not a else "f" if a not in score else "u" if a in x["used"] else "o" if a in out else "s"
                      fate.append((x, a, code))
                  all_lose = len(fate) > 0 and all(c != "s" for _, _, c in fate)
                  for x, a, code in fate:
                      if x["a"] in novhp: x["eligible"] = False
                      if code in ("s", "o"): x["used"].append(a); x["t4"] += jsround(score[a] * 1e4)
                      if code == "s": x["log"] += "s"; continue
                      if all_lose and code == "o": x["log"] += "v"; continue
                      x["log"] += code; x["lives"] -= 1
                      if x["lives"] <= 0: x["outN"] = day["n"]
                  endN = day["n"]
                  left = sum(1 for x in ps.values() if x["outN"] is None)
                  if (started > 2 and left <= 2) or day["n"] >= 14: over = True
              players = rank([{"a": x["a"], "lives": max(0, x["lives"]), "outN": x["outN"], "total": x["t4"] / 1e4, "used": x["used"], "log": x["log"], "eligible": x["eligible"]} for x in ps.values()])
              return players, over, endN
          def prizes(players):
              missed = lambda x: x["outN"] is not None and x["log"][x["outN"] - 1] == "n"
              can = [x for x in players if x["eligible"] and not x["staked"] and not missed(x)]
              if sum(1 for x in can if sum(x["log"].count(c) for c in "sov") >= 2) < 3: return []
              ranked, amounts, out, i = rank(can), [4, 2], [], 0
              while i < len(ranked) and i < len(amounts):
                  j = i
                  while j + 1 < len(ranked) and ranked[j + 1]["place"] == ranked[i]["place"]: j += 1
                  pot = sum(amounts[k] for k in range(i, j + 1) if k < len(amounts))
                  each = math.floor((pot / (j - i + 1)) * 1e8) / 1e8
                  out += [{"player": ranked[k]["a"], "place": ranked[k]["place"], "vhp": each} for k in range(i, j + 1)]
                  i = j + 1
              return out
          def decoded(j):
              who, prods = j["who"], j["prods"]
              return [{"n": x["n"], "field": x["field"], "counts": x["counts"], "picks": [(who[p], prods[q]) for p, q in x["picks"]], "noVhp": [who[a] for a in x["noVhp"]]} for x in j["days"]]
          def week_rows(days, k, staked):
              # KSurvivor.weekRows: staked players still in when the week began, by the standings when it ends.
              end, over, endN = play([x for x in days if x["n"] <= 7 * (k + 1)])
              if not over and endN < 7 * (k + 1): return None
              still = None
              if k > 0:
                  start, over0, _ = play([x for x in days if x["n"] <= 7 * k])
                  if over0: return []
                  still = {x["a"] for x in start if x["outN"] is None}
              sel = [x for x in end if x["a"] in staked and (still is None or x["a"] in still)]
              return [{"player": x["a"], "points": max(1, 256 - x["place"])} for x in rank(sel)]
          def replay_ok(j, r, f):
              who = j["who"]
              players, over, endN = play(decoded(j))
              staked = {who[a] for x in j["stakes"] for a in x["staked"]}
              players = [dict(p, staked=p["a"] in staked) for p in players]
              assert r["players"] == players and r["over"] == over and r["endN"] == endN, f + ": the result isn't what its days give"
              w1 = week_of(j["startDay"])
              assert not r["final"] or all(any(x["week"] == w and x["final"] for x in j["stakes"]) for w in (w1, w1 + 1)), f + ": final before both weeks' stakes are known"
              assert r["prizes"] == (prizes(players) if r["final"] else []), f + ": the prizes aren't what the result gives"
          def season_ok(j, f):
              assert set(j) == {"v", "season", "startDay", "who", "prods", "days", "stakes", "result"} and j["v"] == 2 and small(j["season"], 1, 9999) and f == "S%03d.json" % j["season"] and day(j["startDay"]), f
              who, prods = j["who"], j["prods"]
              assert type(who) is list and len(who) <= 100000 and all(isaddr(a) for a in who) and len(set(who)) == len(who), f
              assert type(prods) is list and len(prods) <= 500 and all(isaddr(a) for a in prods) and len(set(prods)) == len(prods), f
              assert type(j["days"]) is list and len(j["days"]) <= 14, f
              w1 = week_of(j["startDay"])
              st = j["stakes"]
              assert type(st) is list and len(st) <= 2 and len({x["week"] for x in st if type(x) is dict and "week" in x}) == len(st), f
              for x in st:
                  assert type(x) is dict and set(x) == {"week", "final", "day", "staked"} and type(x["week"]) is int and x["week"] in (w1, w1 + 1), f
                  assert type(x["final"]) is bool and day(x["day"]) and type(x["staked"]) is list and len(x["staked"]) <= 100000, f
                  assert all(small(a, 0, len(who) - 1) for a in x["staked"]) and len(set(x["staked"])) == len(x["staked"]), f
              first = None
              for i, x in enumerate(j["days"]):
                  assert type(x) is dict and set(x) == {"n", "day", "field", "counts", "picks", "noVhp"} and x["n"] == i + 1 and x["day"] == j["startDay"] + i, f
                  assert field_ok(x["field"]) and counts_ok(x["counts"]), f
                  assert type(x["picks"]) is list and len(x["picks"]) <= 100000 and all(type(p) is list and len(p) == 2 and small(p[0], 0, len(who) - 1) and small(p[1], 0, len(prods) - 1) for p in x["picks"]), f
                  assert len({p[0] for p in x["picks"]}) == len(x["picks"]), f
                  assert type(x["noVhp"]) is list and len(x["noVhp"]) <= 100000 and all(small(a, 0, len(who) - 1) for a in x["noVhp"]), f
                  if i == 0: first = {who[p[0]] for p in x["picks"]}
              r = j["result"]
              if r is None: return
              replay_ok(j, r, f)
              assert type(r) is dict and set(r) == {"over", "endN", "final", "players", "prizes"} and type(r["over"]) is bool and type(r["final"]) is bool, f
              assert small(r["endN"], 0, len(j["days"])) and (r["over"] or not r["final"]), f
              ps = r["players"]
              assert type(ps) is list and len(ps) <= 100000 and all(player_ok(p, r["endN"]) for p in ps), f
              byA = {p["a"]: p for p in ps}
              assert len(byA) == len(ps) and set(byA) == (first or set()), f              # exactly the day-1 players
              assert all(ps[i]["place"] <= ps[i + 1]["place"] for i in range(len(ps) - 1)) and (not ps or ps[0]["place"] == 1), f
              pz = r["prizes"]
              assert type(pz) is list and len(pz) <= len(ps) and all(type(p) is dict and set(p) == {"player", "place", "vhp"} and isaddr(p["player"]) and small(p["place"], 1, 2) and num(p["vhp"]) and 0 < p["vhp"] <= 4 for p in pz), f
              assert sum(round(p["vhp"] * 1e8) for p in pz) <= 6 * 10**8, f    # in whole units of 1e-8 VHP (no float drift)
              assert not pz or r["final"], f
              assert len({p["player"] for p in pz}) == len(pz), f
              can = lambda p: p["eligible"] and not (p["outN"] is not None and p["log"][p["outN"] - 1] == "n")
              assert all(p["player"] in byA and can(byA[p["player"]]) for p in pz), f
              assert not pz or sum(1 for p in ps if can(p) and sum(p["log"].count(c) for c in "sov") >= 2) >= 3, f
          seasons = {}
          for f in os.listdir(d):
              if f == "vault": continue
              j = json.load(open(os.path.join(d, f), encoding="utf-8"), parse_constant=bad_constant)
              assert type(j) is dict, f
              if f == "index.json":
                  assert set(j) == {"v", "updated", "firstDay", "contract", "seasons"} and j["v"] == 1 and iso(j["updated"]), f
                  assert (j["firstDay"] is None or day(j["firstDay"])) and (j["contract"] is None or isaddr(j["contract"])), f
                  assert type(j["seasons"]) is list and all(small(s, 1, 9999) for s in j["seasons"]), f
                  continue
              if f == "days.json":
                  assert set(j) == {"v", "updated", "days"} and j["v"] == 1 and iso(j["updated"]) and type(j["days"]) is list and len(j["days"]) <= 60, f
                  for x in j["days"]:
                      assert type(x) is dict and set(x) == {"day", "heights", "blocks", "checked", "counts"} and day(x["day"]) and small(x["checked"], 1, 2), f
                      assert type(x["heights"]) is list and len(x["heights"]) == 2 and all(nat(h) for h in x["heights"]) and nat(x["blocks"]) and counts_ok(x["counts"]), f
                      assert sum(c for _, c in x["counts"]) == x["blocks"] == x["heights"][1] - x["heights"][0] + 1, f
                  continue
              if f == "fields.json":
                  assert set(j) == {"v", "updated", "fields"} and j["v"] == 1 and iso(j["updated"]) and type(j["fields"]) is list and len(j["fields"]) <= 2, f
                  for x in j["fields"]:
                      assert type(x) is dict and set(x) == {"day", "season", "n", "out", "field"} and day(x["day"]) and nat(x["out"]) and field_ok(x["field"]), f
                      assert (x["season"] is None or small(x["season"], 1, 9999)) and (x["n"] is None or small(x["n"], 1, 14)), f
                  continue
              season_ok(j, f)
              seasons[j["season"]] = j
          # The vault's results files (vault/W<week>.json, Vault v6): game 3, no rows, at most 10 wallets per place, and
          # exactly the winners of the season file published with it. A file whose season file isn't here (left out for
          # size) can't be checked, so it is left out too, and the run fails (exit 3) so it alerts.
          vd, unchecked = os.path.join(d, "vault"), []
          for f in (sorted(os.listdir(vd)) if os.path.isdir(vd) else []):
              m = re.fullmatch(r"W(0|[1-9][0-9]{0,4})\.json", f)
              assert m, "vault/" + f
              j = json.load(open(os.path.join(vd, f), encoding="utf-8"), parse_constant=bad_constant)
              w = int(m.group(1))
              assert type(j) is dict and set(j) == {"game", "week", "final", "rows", "first", "second"} and j["game"] == 3 and type(j["game"]) is int, f
              assert type(j["week"]) is int and j["week"] == w and j["final"] is True and type(j["rows"]) is list, f
              assert all(type(x) is dict and set(x) == {"player", "points"} and isaddr(x["player"]) and small(x["points"], 1, 255) for x in j["rows"]), f
              assert all(type(j[k]) is list and len(j[k]) <= 10 and all(isaddr(a) for a in j[k]) and j[k] == sorted(set(j[k])) for k in ("first", "second")), f
              assert not set(j["first"]) & set(j["second"]), f
              mine = [s for s in seasons.values() if week_of(s["startDay"]) in (w, w - 1)]
              if not mine: unchecked.append(f); continue
              s = mine[0]
              k = w - week_of(s["startDay"])
              st = [x for x in s["stakes"] if x["week"] == w]
              assert st and st[0]["final"], f + ": its week's stakes aren't final"
              rows = week_rows(decoded(s), k, {s["who"][a] for a in st[0]["staked"]})
              assert rows is not None and j["rows"] == rows, f + ": not the season's staked players' points"
              if k == 0:
                  assert j["first"] == [] and j["second"] == [], f + ": winners only in a season's last week"
                  continue
              r = s["result"]
              assert r is not None and r["final"] is True, f + ": its season isn't final"
              at = lambda place: sorted(p["player"] for p in r["prizes"] if p["place"] == place)
              first, second = at(1), at(2)
              if len(first) > 10: first, second = [], []
              if len(second) > 10: second = []
              assert j["first"] == first and j["second"] == second, f + ": not the season's winners"
          for f in unchecked:
              print("::error::Not publishing survivor/vault/%s this run: its season file isn't published with it" % f)
              os.remove(os.path.join(vd, f))
          print("survivor files ok")
          sys.exit(3 if unchecked else 0)
          PY
          fi
          if [ "$rc" = 3 ]; then failed=1; elif [ "$rc" != 0 ]; then drop survivor "its files don't have the recorder's shape"; fi
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init -q work && cd work
          parent=""
          if git fetch -q --depth 1 "$remote" games-data 2>/dev/null; then
            parent=$(git rev-parse FETCH_HEAD)
            git read-tree FETCH_HEAD
          else git read-tree --empty; fi
          shopt -s nullglob
          for f in "$IN"/blockx/*.json "$IN"/blockx/vault/*.json "$IN"/survivor/*.json "$IN"/survivor/vault/*.json; do
            name="${f#"$IN"/}"
            # Audit BX-5: a final week's prize file (P###.json), and the Vault's results file (vault/W<week>.json), are
            # written once and never replaced (Survivor's vault files too).
            if [[ "$name" =~ (/P[0-9]{3}|/vault/W[0-9]+)\.json$ ]] && git cat-file -e ":$name" 2>/dev/null; then echo "Keeping the published $name as it is."; continue; fi
            blob=$(git hash-object -w "$f")
            git update-index --add --cacheinfo 100644 "$blob" "$name"
          done
          tree=$(git write-tree)
          if [ -n "$parent" ] && [ "$tree" = "$(git rev-parse "$parent^{tree}")" ]; then echo "No changes."; exit "$failed"; fi
          export GIT_AUTHOR_NAME=kpred-bot GIT_AUTHOR_EMAIL=kpred-bot@users.noreply.github.com GIT_COMMITTER_NAME=kpred-bot GIT_COMMITTER_EMAIL=kpred-bot@users.noreply.github.com
          commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "games: record")
          git push -q "$remote" "$commit:refs/heads/games-data"
          echo "Games files published."
          exit "$failed"
