# KnodeGames recorders: every hour, records each game's results from the chain (irreversible blocks only, two nodes
# must agree). Today: Who Signs Block X (bot/games/blockx.ts). Each game has its own folder on the games-data branch.
#
# Two jobs, like the race and the main bot, so repository code never runs next to a write token:
#   record   runs the recorders with a read-only token and no secrets (they only read the chain), and hands the files on.
#   publish  runs no repository code: it checks the files' shape and pushes them to the games-data branch.
# It never touches main, holds no key, and does not run on pull requests.
#
# Turn it on: Settings → Secrets and variables → Actions → Variables: GAMES_ENABLED = true
name: KnodeGames recorders

on:
  schedule:
    - cron: "47 * * * *"     # every hour at minute 47 (after the race recorder at :37 has taken the hour's card)
  workflow_dispatch: {}

concurrency:
  group: knode-games
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  record:
    if: ${{ vars.GAMES_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund --ignore-scripts
      # The files the last run published, and the race recorder's cards (public branches; read without a token).
      # Only plain JSON files with the expected names are taken.
      - name: Take the last run's files and the race cards
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prev/blockx" "$RUNNER_TEMP/race"
          if git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" games-data 2>/dev/null; then
            # (audit BX-34: names read line by line, never word-split; only expected names are taken)
            { git ls-tree --name-only FETCH_HEAD:blockx 2>/dev/null || true; } | while IFS= read -r f; do
              if [[ "$f" =~ ^(index|board|W[0-9]{3}|P[0-9]{3})\.json$ ]]; then git show "FETCH_HEAD:blockx/$f" > "$RUNNER_TEMP/prev/blockx/$f"; fi
            done
            # Audit BX-81: the published vault files too, so the recorder doesn't write one again once it is published.
            mkdir -p "$RUNNER_TEMP/prev/blockx/vault"
            { git ls-tree --name-only FETCH_HEAD:blockx/vault 2>/dev/null || true; } | while IFS= read -r f; do
              if [[ "$f" =~ ^W[0-9]+\.json$ ]]; then git show "FETCH_HEAD:blockx/vault/$f" > "$RUNNER_TEMP/prev/blockx/vault/$f"; fi
            done
          else echo "No games-data branch yet."; fi
          if git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" race-data 2>/dev/null; then
            { git ls-tree --name-only FETCH_HEAD 2>/dev/null || true; } | while IFS= read -r f; do
              if [[ "$f" =~ ^W[0-9]{3}\.json$ ]]; then git show "FETCH_HEAD:$f" > "$RUNNER_TEMP/race/$f"; fi
            done
          else echo "No race-data branch yet: targets wait for cards."; fi
      - name: Record Who Signs Block X
        run: npm run blockx
        env:
          RPC: ${{ vars.RPC || 'https://koinos.armana.io' }}
          RPC_CHECK: ${{ vars.RPC_CHECK || 'https://api.koinosblocks.com' }}
          BLOCKX_PREV: ${{ runner.temp }}/prev/blockx
          BLOCKX_OUT: ${{ runner.temp }}/games-data/blockx
          RACE_DATA: ${{ runner.temp }}/race
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: games-data
          path: ${{ runner.temp }}/games-data/
          retention-days: 1
          if-no-files-found: ignore

  publish:
    needs: record
    if: ${{ vars.GAMES_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write         # push the games-data branch (never main)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: games-data
          path: ${{ runner.temp }}/incoming
      - name: Push games-data (and nothing else)
        env:
          GH_TOKEN: ${{ github.token }}
          IN: ${{ runner.temp }}/incoming
        run: |
          set -euo pipefail
          if [ ! -d "$IN" ]; then echo "Nothing to publish."; exit 0; fi
          bad=$(find "$IN" -mindepth 1 \( -type l -o \( -type d ! -path "$IN/blockx" ! -path "$IN/blockx/vault" \) -o \( -type f ! -regex "$IN/blockx/\(index\|board\|W[0-9][0-9][0-9]\|P[0-9][0-9][0-9]\)\.json" ! -regex "$IN/blockx/vault/W[0-9][0-9]*\.json" \) \) -print)
          if [ -n "$bad" ]; then echo "::error::Refusing to publish unexpected files: $bad"; exit 1; fi
          big=$(find "$IN" -type f -size +2048k -print)
          if [ -n "$big" ]; then echo "::error::Refusing to publish files over 2 MB: $big"; exit 1; fi
          # Audit BX-79 / BX-80: the published branch first (read only here): the vault and prize files are judged against
          # what is ALREADY published and the job's own clock, never against this run's own board.
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          PUB=$(mktemp -d); HELD="$PUB/held"; : > "$HELD"; mkdir -p "$PUB/blockx"
          git init -q work && cd work
          parent=""
          if git fetch -q --depth 1 "$remote" games-data 2>/dev/null; then
            parent=$(git rev-parse FETCH_HEAD)
            git read-tree FETCH_HEAD
            { git ls-tree --name-only "$parent:blockx" 2>/dev/null || true; } | while IFS= read -r f; do
              if [[ "$f" =~ ^(board|index|P[0-9]{3}|W[0-9]{3})\.json$ ]]; then git show "$parent:blockx/$f" > "$PUB/blockx/$f"; fi
            done
          else git read-tree --empty; fi
          # The content must be the recorder's own shape, not only parse as JSON.
          /usr/bin/python3 - "$IN/blockx" 2 "$PUB/blockx" "$HELD" blockx 2400 0 <<'PY'
          import json, os, re, sys
          d = sys.argv[1]; gid = int(sys.argv[2]); addr = re.compile(r"1[1-9A-HJ-NP-Za-km-z]{25,34}")
          iso = re.compile(r"\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(\.\d{3})?Z"); ymd = re.compile(r"\d{4}-\d\d-\d\d")
          # Audit BX-95 (round 6): the recorder is JavaScript, which rounds integers above 2^53 - 1, so nothing larger is
          # ever published (a number it can't read back exactly would make every honest run look like a rewrite).
          # Audit BX-112 (round 7): an address is a JSON string, never a number made of 1s (which JavaScript rounds).
          isaddr = lambda v: type(v) is str and addr.fullmatch(v) is not None
          SAFE = 2**53 - 1
          num = lambda x: type(x) in (int, float) and x == x and abs(x) <= SAFE
          nat = lambda x: type(x) is int and 0 <= x <= SAFE
          WEEK = 7 * 86400000
          # Audit BX-95 / BX-112 / BX-113 (rounds 6-7), the root cause: the recorders are JavaScript. Every value of every
          # incoming file must be one JavaScript reads back exactly (integers and numbers within 2^53 - 1, finite), so a
          # bad run can never publish a value that makes every honest run after it look like a rewrite.
          def js_safe(o, depth=0):
              if depth > 64: return False
              if o is None or type(o) in (bool, str): return True
              if type(o) is int: return abs(o) <= 2**53 - 1
              if type(o) is float: return o == o and abs(o) <= 2**53 - 1
              if type(o) is list: return all(js_safe(x, depth + 1) for x in o)
              if type(o) is dict: return all(type(k) is str and js_safe(v, depth + 1) for k, v in o.items())
              return False
          for _root, _dirs, _files in os.walk(d):
              for _f in _files:
                  if _f.endswith(".json"):
                      assert js_safe(json.load(open(os.path.join(_root, _f), encoding="utf-8"))), "a value the recorder (JavaScript) can't read back exactly: " + _f
          def target_ok(t):
              if type(t) is not dict or not set(t) <= {"round", "height", "final", "checked", "signer", "time", "lockTime", "card", "void", "picks"}: return False
              if not ({"round", "height", "final", "checked", "signer", "time", "lockTime", "card", "picks"} <= set(t)): return False
              if not (nat(t.get("round")) and nat(t.get("height")) and t["height"] >= t["round"] and t.get("final") is True and type(t.get("checked")) is int and t["checked"] in (0, 1, 2)): return False
              if not (t.get("signer") is None or isaddr(t["signer"])) or not nat(t.get("time")) or not nat(t.get("lockTime")): return False
              c = t.get("card")
              if c is not None and (type(c) is not dict or set(c) not in ({"at", "top", "signerVhp"}, {"at", "top", "signerVhp", "afterAt"}) or not num(c["at"]) or not num(c["top"]) or not (c["signerVhp"] is None or num(c["signerVhp"])) or ("afterAt" in c and not (num(c["afterAt"]) and c["afterAt"] > c["at"]))): return False
              if "void" in t and (type(t["void"]) is not str or len(t["void"]) > 200): return False
              pk = t.get("picks")
              return type(pk) is list and len(pk) <= 100000 and all(type(x) is list and len(x) == 5 and isaddr(x[0]) and isaddr(x[1])
                  and nat(x[2]) and type(x[3]) is int and 0 <= x[3] <= 300 and type(x[4]) is int and x[4] in (0, 1) for x in pk)
          def rows_ok(rows):
              return type(rows) is list and len(rows) <= 100000 and all(type(x) is dict and set(x) == {"a", "place", "boardPlace", "pts", "correct", "picks", "days", "lastCorrect", "ranked"} and isaddr(x["a"])
                  and all(nat(x[k]) for k in ("place", "boardPlace", "pts", "correct", "picks", "days", "lastCorrect")) and type(x["ranked"]) is bool for x in rows)
          def prizes_ok(p):
              return type(p) is list and len(p) <= 50 and all(type(x) is dict and set(x) == {"player", "place", "vhp"} and isaddr(x["player"]) and nat(x["place"]) and num(x["vhp"]) and 0 < x["vhp"] <= 2 for x in p)
          def card_ok(c):
              if type(c) is not dict or set(c) != {"at", "blocksPerRace", "c", "fairness", "field", "paddock"} or not num(c["at"]) or not num(c["blocksPerRace"]) or not num(c["c"]): return False
              if not (c["fairness"] is None or (type(c["fairness"]) is list and len(c["fairness"]) == 2 and all(num(v) for v in c["fairness"]))): return False
              if type(c["field"]) is not list or type(c["paddock"]) is not list or len(c["field"]) + len(c["paddock"]) > 500: return False
              return all(type(r) is dict and set(r) == {"a", "vhp", "k", "h"} and isaddr(r["a"]) and all(num(r[k]) for k in ("vhp", "k", "h")) for r in c["field"]) and \
                  all(type(r) is dict and set(r) == {"a", "vhp", "k"} and isaddr(r["a"]) and all(num(r[k]) for k in ("vhp", "k")) for r in c["paddock"])
          def vault_ok(j, f):
              # The Vault (v6) results file: staked players' points (1-255) in rows, the free board's 1st and 2nd (at
              # most 10 per place); every wallet once.
              if type(j) is not dict or set(j) != {"game", "week", "final", "rows", "first", "second"} or j["game"] != gid or j["final"] is not True: return False
              if not nat(j["week"]) or f != "W%d.json" % j["week"]: return False
              rows = j["rows"]
              if type(rows) is not list or len(rows) > 100000 or not all(type(x) is dict and set(x) == {"player", "points"} and type(x["player"]) is str and addr.fullmatch(x["player"])
                  and type(x["points"]) is int and 1 <= x["points"] <= 255 for x in rows): return False
              w = j["first"] + j["second"] if type(j["first"]) is list and type(j["second"]) is list else None
              if w is None or len(j["first"]) > 10 or len(j["second"]) > 10 or not all(type(a) is str and addr.fullmatch(a) for a in w): return False
              allw = w + [x["player"] for x in rows]
              return len(set(allw)) == len(allw)
          # Audit BX-62 / BX-65 / BX-79 / BX-80 / BX-81 (rounds 3-4): prize files (P<w>) and vault files (vault/W<w>) are
          # write-once, so they are judged against the PUBLISHED board and prize files and this job's own clock, never this
          # run's own board. A file that fails is HELD (not published; the recorder writes it again next run) and the rest
          # of the run is published; a hold that isn't just "not yet" fails the job at the end so you are emailed.
          import time
          GENESIS = 1792368000000                                   # Block X weeks: the vault's genesis (2026-10-19 00:00 UTC)
          # (CHECK_NOW_MS: the tests' fixed clock; the workflow never sets it.)
          now = int(os.environ.get("CHECK_NOW_MS") or time.time() * 1000); cw = (now - GENESIS) // WEEK
          pub = sys.argv[3] if len(sys.argv) > 3 else ""; heldf = sys.argv[4] if len(sys.argv) > 4 else ""
          pre = sys.argv[5] if len(sys.argv) > 5 else "blockx"   # the folder on the published branch
          # The game's round size and offset (a target's height is round * size + offset), for the new-target check.
          GROUND = int(sys.argv[6]) if len(sys.argv) > 6 and re.fullmatch(r"[1-9]\d{0,6}", sys.argv[6]) else None
          GOFFSET = int(sys.argv[7]) if len(sys.argv) > 7 and re.fullmatch(r"\d{1,7}", sys.argv[7]) else None
          held = []
          def hold(name, why, alert):
              held.append(name); print(("::error::" if alert else "::notice::") + "held, not published: " + name + ": " + why)
              if alert: held.append("!alert")
          def pubjson(name):
              path = os.path.join(pub, name) if pub else ""
              return json.load(open(path, encoding="utf-8")) if path and os.path.isfile(path) else None
          pb = pubjson("board.json"); plw = pb.get("lastWeek") if type(pb) is dict else None
          def week_final(w):
              return type(plw) is dict and plw.get("week") == w and plw.get("final") is True and plw.get("start") == GENESIS + w * WEEK \
                  and type(plw.get("prizes")) is list and type(plw.get("rows")) is list and now >= GENESIS + (w + 1) * WEEK + 12 * 3600000
          for f in sorted(os.listdir(d)):
              if not re.fullmatch(r"P\d{3}\.json", f): continue
              j = json.load(open(os.path.join(d, f), encoding="utf-8"))
              assert set(j) == {"v", "week", "game", "at", "prizes"} and j["v"] == 1 and j["game"] == gid and f == "P%03d.json" % j["week"], f
              assert iso.fullmatch(str(j["at"])) and prizes_ok(j["prizes"]), f
              w = j["week"]
              # (A week not over yet, or not final on the published board yet: simply not yet. An older week: an alert.)
              if w < cw - 1: hold(pre + "/" + f, "an older week than the one that just ended, by this job's clock", True)
              elif w > cw - 1 or not week_final(w): hold(pre + "/" + f, "its week isn't over and final on the published board yet", False)
              elif j["prizes"] != plw["prizes"]: hold(pre + "/" + f, "its prizes differ from the published final board", True)
          vdir = os.path.join(d, "vault")
          for f in (sorted(os.listdir(vdir)) if os.path.isdir(vdir) else []):
              name = pre + "/vault/" + f
              j = json.load(open(os.path.join(vdir, f), encoding="utf-8"))
              if not vault_ok(j, f): hold(name, "not the vault file's shape", True); continue
              w = j["week"]; end = GENESIS + (w + 1) * WEEK
              pp = pubjson("P%03d.json" % w)
              if w != cw - 1 or not (end <= now <= end + 3 * 86400000): hold(name, "not the week that just ended, within the vault's 3 days, by this job's clock", True); continue
              if not week_final(w) or type(pp) is not dict or pp.get("prizes") != plw["prizes"]: hold(name, "its week and prize file aren't final on the published branch yet", False); continue
              # rows: Staked-board players of the PUBLISHED final board (with points), in board order, points recomputed
              # (1-255 by distinct place, as bot/games/blockx.ts vaultPoints over the players the vault counts).
              ranked = [r for r in plw["rows"] if r.get("ranked") is True and type(r.get("pts")) is int and r["pts"] > 0]
              order = [r["a"] for r in ranked]; place = {r["a"]: r["place"] for r in ranked}
              who = [x["player"] for x in j["rows"]]
              pos = [order.index(a) if a in order else -1 for a in who]
              if not (all(p >= 0 for p in pos) and pos == sorted(pos)): hold(name, "rows aren't the published Staked board's players in board order", True); continue
              places = sorted({place[a] for a in who}); want = {pl: max(1, 255 - k) for k, pl in enumerate(places)}
              if any(x["points"] != want[place[x["player"]]] for x in j["rows"]): hold(name, "points don't follow the published board's places", True); continue
              # first / second: the published prize file's winners, as bot/games/blockx.ts vaultFile builds them.
              at = lambda n: sorted({x["player"] for x in pp["prizes"] if x["place"] == n})
              first = at(1); second = [] if len(first) >= 2 else sorted({x["player"] for x in pp["prizes"] if x["place"] != 1})
              first = [] if len(first) > 10 else first; second = [] if len(second) > 10 else second
              st = set(who); first = [a for a in first if a not in st]; second = [a for a in second if a not in st]
              if j["first"] != first or j["second"] != second: hold(name, "first/second aren't the published prize file's winners", True); continue
              # Audit BX-65 (round 5): Staked-board players left out of the rows (the vault counts only wallets whose
              # LOWEST stake that week met the minimum, read on two nodes, which this job can't re-read): published, but
              # named in an error that fails the job (so you are emailed, once: the file is written once) and checked
              # within the vault's 3 days.
              out = [a for a in order if a not in st]
              if out: held.append("!alert"); print("::error::(published unless held below; check it) " + name + ": " + str(len(out)) + " of " + str(len(order)) + " Staked-board players with points are not in the vault rows (not staked all week, by the recorder's two-node read): " + ", ".join(out[:20]) + (" ..." if len(out) > 20 else ""))
          # Audit BX-88 (round 5): published targets are append-only. A week file may add rounds but never change or drop
          # one that is already published (an honest run never rewrites a recorded target: bot/games/blockx.ts keeps them).
          # A run that tries is held WHOLE, with an alert: its board, prize and vault files were all built from that file.
          rewrote = []
          # Published targets, by week file.
          pubt = {}
          for f in (sorted(os.listdir(pub)) if pub and os.path.isdir(pub) else []):
              if re.fullmatch(r"W\d{3}\.json", f):
                  o = pubjson(f)
                  pubt[f] = [t for t in o["targets"] if type(t) is dict and type(t.get("round")) is int] if type(o) is dict and type(o.get("targets")) is list else None
          for f in sorted(os.listdir(d)):
              if not re.fullmatch(r"W\d{3}\.json", f): continue
              new = json.load(open(os.path.join(d, f), encoding="utf-8"))
              nt = new.get("targets") if type(new) is dict else None
              # (BX-106: validated before anything is compared, so a crafted file can't crash the check.)
              if type(nt) is not list or not all(type(t) is dict and type(t.get("round")) is int for t in nt) or len({t["round"] for t in nt}) != len(nt):
                  rewrote.append(f + " (its rounds aren't a list of distinct targets)"); continue
              # Review (round 5) and audit BX-97 / BX-98 (round 6): NEW rounds must be real past targets of a week that is
              # still open, so a bad run can't pre-publish a round (the honest recorder would keep it and never record the
              # real one), add one the recorder would drop on load (that would hold every later honest run), or add one to
              # a week whose prize file is published or that has ended for good:
              # - the week is the current one or the one just ended (by this job's clock), and its P file isn't published;
              # - the height is the game's target height for the round (as bot/games/blockx.ts loadWeek);
              # - the block time is before this job's clock and inside the week.
              # (Round-6 blind review: a rule tying a new round's time to its published neighbours let one bad run, or an
              # honest void row's estimated time, hold every later honest run, so it is gone. A future round given a past
              # time (BX-97) is caught before prizes by the week-end re-read of every target on both nodes.)
              wk = new.get("week")
              wstart = GENESIS + wk * WEEK if type(wk) is int else None
              ot = pubt.get(f)
              if f in pubt and ot is None: rewrote.append(f + " (the published file can't be read)"); continue
              pubrounds = {t["round"] for t in (ot or [])}
              fresh = [t for t in nt if t["round"] not in pubrounds]
              if fresh:
                  why = None
                  if wstart is None or new.get("start") != wstart or not (cw - 1 <= wk <= cw): why = "new targets for a week that isn't this one or the one just ended, by this job's clock"
                  elif pubjson("P%03d.json" % wk) is not None: why = "new targets for a week whose prize file is already published"
                  elif GROUND is None or GOFFSET is None: why = "this job doesn't know the game's round size, so it can't check new targets"
                  else:
                      bad = []
                      for t in fresh:
                          h, tm = t.get("height"), t.get("time")
                          ok = type(tm) is int and type(h) is int and h == t["round"] * GROUND + GOFFSET and wstart <= tm < wstart + WEEK and tm <= now
                          if not ok: bad.append(t["round"])
                      if bad: why = "new rounds " + ", ".join(str(r) for r in bad[:10]) + " aren't past target blocks of this week"
                  if why: rewrote.append(f + " (" + why + ")"); continue
              if ot is None: continue
              mine = {t["round"]: t for t in nt}
              changed = [t["round"] for t in ot if mine.get(t["round"]) != t]
              if changed: rewrote.append(f + " (rounds " + ", ".join(str(r) for r in changed[:10]) + " differ from the published targets)")
          # Audit BX-96 (round 6): index.json's week list is append-only too (the all-time board is built from it).
          pi = pubjson("index.json")
          if type(pi) is dict and type(pi.get("weeks")) is list and os.path.isfile(os.path.join(d, "index.json")):
              ni = json.load(open(os.path.join(d, "index.json"), encoding="utf-8"))
              lost = [w for w in pi["weeks"] if not (type(ni) is dict and type(ni.get("weeks")) is list and w in ni["weeks"])]
              if lost: rewrote.append("index.json (published weeks " + ", ".join(str(w) for w in lost[:10]) + " are missing)")
              added = [w for w in (ni.get("weeks") if type(ni) is dict and type(ni.get("weeks")) is list else []) if w not in pi["weeks"] and not (type(w) is int and cw - 1 <= w <= cw)]
              if added: rewrote.append("index.json (new weeks " + ", ".join(str(w) for w in added[:10]) + " aren't this week or the one just ended)")
          if rewrote:
              print("::error::this run changes or adds to already-published Block X history: " + "; ".join(rewrote) + ". Nothing from it is published (audit BX-88).")
              for f in sorted(os.listdir(d)):
                  if os.path.isfile(os.path.join(d, f)): hold(pre + "/" + f, "the run changes a published target", True)
              for f in (sorted(os.listdir(vdir)) if os.path.isdir(vdir) else []): hold(pre + "/vault/" + f, "the run changes a published target", True)
          if heldf: open(heldf, "w").write("".join(x + "\n" for x in held))
          elif held: sys.exit("held: " + ", ".join(x for x in held if x != "!alert"))

          for f in os.listdir(d):
              if f == "vault" or re.fullmatch(r"P\d{3}\.json", f): continue
              j = json.load(open(os.path.join(d, f), encoding="utf-8"))
              if f == "board.json":
                  assert set(j) == {"v", "updated", "today", "week", "lastWeek", "allTime"} and j["v"] == 1 and iso.fullmatch(str(j["updated"])), f
                  assert type(j["today"]) is dict and set(j["today"]) == {"day", "rows"} and ymd.fullmatch(str(j["today"]["day"])) and rows_ok(j["today"]["rows"]), f
                  assert type(j["week"]) is dict and set(j["week"]) == {"week", "start", "rows"} and nat(j["week"]["week"]) and nat(j["week"]["start"]) and rows_ok(j["week"]["rows"]), f
                  assert type(j["allTime"]) is dict and set(j["allTime"]) == {"rows"} and rows_ok(j["allTime"]["rows"]), f
                  lw = j["lastWeek"]
                  assert lw is None or (type(lw) is dict and set(lw) in ({"week", "start", "final", "rows", "prizes"}, {"week", "start", "final", "rows", "prizes", "frozenAt"})
                      and nat(lw["week"]) and nat(lw["start"]) and type(lw["final"]) is bool and rows_ok(lw["rows"]) and prizes_ok(lw["prizes"])
                      and ("frozenAt" not in lw or iso.fullmatch(str(lw["frozenAt"])))), f
                  continue
              if f == "cards.json":
                  assert set(j) == {"v", "updated", "startHeight", "cards"} and j["v"] == 1 and iso.fullmatch(str(j["updated"])) and nat(j["startHeight"]), f
                  assert type(j["cards"]) is list and len(j["cards"]) <= 500 and all(card_ok(c) for c in j["cards"]), f
                  continue
              if f == "index.json":
                  assert set(j) == {"v", "updated", "weeks", "contract", "game", "prizesFromWeek"} and j["v"] == 1 and iso.fullmatch(str(j["updated"])), f
                  assert type(j["weeks"]) is list and len(j["weeks"]) <= 10000 and all(type(w) is int and 0 <= w < 10000 for w in j["weeks"]), f
                  assert j["game"] == gid and (j["prizesFromWeek"] is None or nat(j["prizesFromWeek"])), f
                  assert j["contract"] is None or isaddr(j["contract"]), f
                  continue
              assert set(j) == {"v", "week", "start", "end", "game", "targets"} and j["v"] == 1 and j["game"] == gid and f == "W%03d.json" % j["week"], f
              assert nat(j["start"]) and nat(j["end"]) and j["end"] - j["start"] == WEEK, f
              assert type(j["targets"]) is list and len(j["targets"]) <= 1000 and all(target_ok(t) for t in j["targets"]), f
          print("games files ok:", d)
          PY
          shopt -s nullglob
          for f in "$IN"/blockx/*.json "$IN"/blockx/vault/*.json; do
            name="${f#"$IN"/}"
            # Audit BX-5: a final week's prize file (P###.json), and the Vault's results file (vault/W<week>.json), are
            # written once and never replaced.
            if grep -qxF "$name" "$HELD"; then continue; fi
            if [[ "$name" =~ (/P[0-9]{3}|/vault/W[0-9]+)\.json$ ]] && git cat-file -e ":$name" 2>/dev/null; then
              # Audit BX-81: a write-once file that differs from the published one is held (with an error, failing the job
              # at the end), never replaced; everything else is still published.
              if [ "$(git hash-object "$f")" != "$(git rev-parse ":$name")" ]; then echo "::error::$name differs from the published file: not replaced."; echo '!alert' >> "$HELD"; fi
              continue
            fi
            blob=$(git hash-object -w "$f")
            git update-index --add --cacheinfo 100644 "$blob" "$name"
          done
          tree=$(git write-tree)
          if [ -n "$parent" ] && [ "$tree" = "$(git rev-parse "$parent^{tree}")" ]; then echo "No changes."
          else
            export GIT_AUTHOR_NAME=kpred-bot GIT_AUTHOR_EMAIL=kpred-bot@users.noreply.github.com GIT_COMMITTER_NAME=kpred-bot GIT_COMMITTER_EMAIL=kpred-bot@users.noreply.github.com
            commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "games: record")
            git push -q "$remote" "$commit:refs/heads/games-data"
          fi
          if grep -qxF '!alert' "$HELD"; then echo "::error::A file was held, or a published file needs your check (see the errors above); everything else was published."; exit 1; fi
          echo "Games files published."
