# Combo Card recorder: every hour, records the Combo Card's cards and results (bot/games/combo.ts) into the combo/
# folder of the games-data branch. It reads the chain (two nodes must agree), the race recorder's files (race-data)
# and the Block X recorder's files (games-data/blockx).
#
# Same two-job pattern as games.yml, so repository code never runs next to a write token:
#   record   runs the recorder with a read-only token and no secrets, and hands the files on.
#   publish  runs no repository code: it checks the files' exact shape and pushes only combo/ to games-data.
# It shares games.yml's concurrency group, so the two never push to games-data at the same time. It never touches
# main, holds no key, and does not run on pull requests.
#
# Turn it on: Settings → Secrets and variables → Actions → Variables: COMBO_ENABLED = true
name: Combo Card recorder

on:
  schedule:
    - cron: "52 * * * *"     # every hour at minute 52, after the race (:37) and Block X (:47) recorders
  workflow_dispatch: {}

concurrency:
  group: knode-games
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  record:
    if: ${{ vars.COMBO_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund --ignore-scripts
      # The last run's files, the Block X results and the race cards and results (public branches; no token).
      # Only plain JSON files with the expected names are taken.
      - name: Take the last run's files, Block X results and race files
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prev/combo/vault" "$RUNNER_TEMP/blockx" "$RUNNER_TEMP/race"
          repo="https://github.com/${GITHUB_REPOSITORY}.git"
          # A branch that exists but can't be fetched, or a GitHub that can't be reached, is an outage: stop rather than
          # record without it (audit FC-1; Repo Lens RL-19: only ls-remote's "no such branch" (2) means no branch).
          fetch_branch() {
            if git fetch -q --depth 1 "$repo" "$1" 2>/dev/null; then return 0; fi
            rc=0; git ls-remote --exit-code --heads "$repo" "$1" >/dev/null 2>&1 || rc=$?
            if [ "$rc" = 2 ]; then return 1; fi
            echo "::error::Could not fetch the $1 branch (git: $rc); not recording this run."; exit 1
          }
          # Names are read line by line and only expected names are taken (as Block X: BX-34, BX-87).
          if fetch_branch games-data; then
            { git ls-tree --name-only FETCH_HEAD:combo 2>/dev/null || true; } | while IFS= read -r f; do
              if [[ "$f" =~ ^(index|board|D[0-9]{5}(-[0-9]{1,3})?)\.json$ ]]; then git show "FETCH_HEAD:combo/$f" > "$RUNNER_TEMP/prev/combo/$f"; fi
            done
            # The published Vault files, so the recorder never writes one again (it is write-once).
            { git ls-tree --name-only FETCH_HEAD:combo/vault 2>/dev/null || true; } | while IFS= read -r f; do
              if [[ "$f" =~ ^W[0-9]+\.json$ ]]; then git show "FETCH_HEAD:combo/vault/$f" > "$RUNNER_TEMP/prev/combo/vault/$f"; fi
            done
            { git ls-tree --name-only FETCH_HEAD:blockx 2>/dev/null || true; } | while IFS= read -r f; do
              if [[ "$f" =~ ^W[0-9]{3}\.json$ ]]; then git show "FETCH_HEAD:blockx/$f" > "$RUNNER_TEMP/blockx/$f"; fi
            done
          else echo "No games-data branch yet."; fi
          if fetch_branch race-data; then
            { git ls-tree --name-only FETCH_HEAD 2>/dev/null || true; } | while IFS= read -r f; do
              if [[ "$f" =~ ^W[0-9]{3}\.json$ ]]; then git show "FETCH_HEAD:$f" > "$RUNNER_TEMP/race/$f"; fi
            done
          else echo "No race-data branch yet: cards wait for race cards."; fi
      # The recorder exits 1 after writing its files when it raised an error (Repo Lens RL-5): the job turns red (you
      # are emailed) and its files are still checked and published.
      - name: Record the Combo Card
        run: npm run combo
        env:
          RPC: ${{ vars.RPC || 'https://koinos.armana.io' }}
          RPC_CHECK: ${{ vars.RPC_CHECK || 'https://api.koinosblocks.com' }}
          COMBO_PREV: ${{ runner.temp }}/prev/combo
          COMBO_OUT: ${{ runner.temp }}/games-data/combo
          RACE_DATA: ${{ runner.temp }}/race
          BLOCKX_DATA: ${{ runner.temp }}/blockx
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: combo-data
          path: ${{ runner.temp }}/games-data/
          retention-days: 1
          if-no-files-found: ignore

  publish:
    needs: record
    if: ${{ always() && needs.record.result != 'cancelled' && needs.record.result != 'skipped' && vars.COMBO_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write         # push the games-data branch (never main)
    steps:
      # Node, pinned as in games.yml (Block X BX-131), only for the byte-form check below; no repository code runs here.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: combo-data
          path: ${{ runner.temp }}/incoming
      - name: Push games-data/combo (and nothing else)
        env:
          GH_TOKEN: ${{ github.token }}
          IN: ${{ runner.temp }}/incoming
        run: |
          set -euo pipefail
          if [ ! -d "$IN/combo" ]; then echo "Nothing to publish."; exit 0; fi
          bad=$(find "$IN" -mindepth 1 \( -type l -o \( -type d ! -path "$IN/combo" ! -path "$IN/combo/vault" \) -o \( -type f ! -regex "$IN/combo/\(index\|board\|D[0-9][0-9][0-9][0-9][0-9]\(-[0-9][0-9]*\)?\)\.json" ! -regex "$IN/combo/vault/W[0-9][0-9]*\.json" \) \) -print)
          if [ -n "$bad" ]; then echo "::error::Refusing to publish unexpected files: $bad"; exit 1; fi
          # Block X round 8 (BX-122), ported for Combo (fix-check 2 FC2-16): every incoming file must be EXACTLY what the
          # JavaScript recorder writes for its own content (JSON.stringify of its parse, plus a newline).
          command -v node >/dev/null || { echo "::error::node is missing on this runner; nothing published"; exit 1; }
          node -e 'const fs=require("fs"),p=require("path"),bad=[];(function w(d){for(const f of fs.readdirSync(d)){const q=p.join(d,f),s=fs.lstatSync(q);if(s.isDirectory()){w(q);continue}if(!f.endsWith(".json"))continue;if(!s.isFile()){bad.push(p.relative(process.argv[1],q));continue}const raw=fs.readFileSync(q);let ok=false;try{ok=Buffer.compare(Buffer.from(JSON.stringify(JSON.parse(raw.toString("utf8")))+"\n","utf8"),raw)===0}catch(e){}if(!ok)bad.push(p.relative(process.argv[1],q))}})(process.argv[1]);if(bad.length){console.log("::error::not in the recorders own JSON form (JSON.stringify of its parse), nothing published: "+bad.join(", "));process.exit(1)}' -- "$IN"
          # The published branch first (read only here): write-once and fixed files are judged against what is ALREADY
          # published and this job's own clock, never against this run's own files (as Block X: BX-79/80/81/88).
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          PUB=$(mktemp -d); HELD="$PUB/held"; : > "$HELD"; mkdir -p "$PUB/combo/vault" "$PUB/blockx" "$PUB/race"
          git init -q work && cd work
          parent=""
          if git fetch -q --depth 1 "$remote" games-data 2>/dev/null; then
            parent=$(git rev-parse FETCH_HEAD)
            git read-tree FETCH_HEAD
            # (Fix-check 2 FC2-6: index.json too, or its append-only check never runs.)
            { git ls-tree --name-only "$parent:combo" 2>/dev/null || true; } | while IFS= read -r f; do
              if [[ "$f" =~ ^(index|board|D[0-9]{5}(-[0-9]{1,3})?)\.json$ ]]; then git show "$parent:combo/$f" > "$PUB/combo/$f"; fi
            done
            # The published Block X results, to re-check new final cards' Block X legs (fix-check 2 FC2-1).
            { git ls-tree --name-only "$parent:blockx" 2>/dev/null || true; } | while IFS= read -r f; do
              if [[ "$f" =~ ^W[0-9]{3}\.json$ ]]; then git show "$parent:blockx/$f" > "$PUB/blockx/$f"; fi
            done
            { git ls-tree --name-only "$parent:combo/vault" 2>/dev/null || true; } | while IFS= read -r f; do
              if [[ "$f" =~ ^W[0-9]+\.json$ ]]; then git show "$parent:combo/vault/$f" > "$PUB/combo/vault/$f"; fi
            done
          else git read-tree --empty; fi
          # The race recorder's published results, to re-check new final cards' race legs (FC2-1). Not readable: new
          # final cards are held (they can't be checked), everything else is published.
          if git fetch -q --depth 1 "$remote" race-data 2>/dev/null; then
            { git ls-tree --name-only FETCH_HEAD 2>/dev/null || true; } | while IFS= read -r f; do
              if [[ "$f" =~ ^W[0-9]{3}\.json$ ]]; then git show "FETCH_HEAD:$f" > "$PUB/race/$f"; fi
            done
          fi
          # The content must be the recorder's own shape, consistent with itself and with what is published.
          /usr/bin/python3 - "$IN/combo" "$PUB/combo" "$HELD" "$PUB/race" "$PUB/blockx" <<'PY'
          import json, os, re, sys, time
          d, pub, heldf = sys.argv[1], sys.argv[2], sys.argv[3]
          raced = sys.argv[4] if len(sys.argv) > 4 else ""; bxd = sys.argv[5] if len(sys.argv) > 5 else ""
          addr = re.compile(r"1[1-9A-HJ-NP-Za-km-z]{25,34}"); iso = re.compile(r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{3})?Z"); ymd = re.compile(r"[0-9]{4}-[0-9]{2}-[0-9]{2}")
          SAFE = 2 ** 53 - 1
          nat = lambda x: type(x) is int and 0 <= x <= SAFE
          isaddr = lambda a: type(a) is str and addr.fullmatch(a) is not None
          DAY = 86400000; WEEK = 7 * DAY; HOUR = 3600000; GENESIS = 1792368000000   # week 0: 2026-10-19 00:00 UTC
          CARDS_PER_DAY = 3; MAX_CHANGES = 3; MAX_SIZE = 2048 * 1024; BEST = 10; MIN_WEEK_PTS = 100
          BASE = {2: 3, 3: 7, 4: 15, 5: 30, 6: 60, 7: 120, 8: 240, 9: 480, 10: 960}
          RESULTS = ("pending", "hit", "miss", "void", "unresolved")
          # (CHECK_NOW_MS: the tests' fixed clock; the workflow never sets it.)
          now = int(os.environ.get("CHECK_NOW_MS") or time.time() * 1000)
          cw = (now - GENESIS) // WEEK; today = now // DAY
          first_day = (GENESIS + max(0, cw - 1) * WEEK) // DAY        # Monday of last week
          held = []
          def hold(name, why, alert):
              if name not in held: held.append(name)
              print(("::error::" if alert else "::notice::") + "held, not published: " + name + ": " + why)
              if alert: held.append("!alert")
          # Fix-check FC-24 (Block X round 7): JavaScript compares with ===, Python's == says True == 1 and 3.0 == 3, so
          # published content is compared with same(), types included.
          def same(a, b):
              if type(a) is not type(b): return False
              if type(a) is dict: return a.keys() == b.keys() and all(same(a[k], b[k]) for k in a)
              if type(a) is list: return len(a) == len(b) and all(same(x, y) for x, y in zip(a, b))
              return a == b
          def load(path):
              try: return json.load(open(path, encoding="utf-8"))
              except Exception: return None
          def points(fs):
              if not 2 <= len(fs) <= 10: return 0
              num = BASE[len(fs)] * 100; den = 1
              for f in fs: num *= f; den *= 100
              return num // den
          def recount(c):
              # As bot/games/combo.ts recount: a miss decides; else an unresolved leg voids the card (fix-check FC-2).
              if c["priceAt"] is None: return ("void", 0)
              if any(l[4] == "miss" or (l[4] == "hit" and not l[3] > 0) for l in c["legs"]): return ("miss", 0)
              if any(l[4] == "unresolved" for l in c["legs"]): return ("void", 0)
              kept = [l for l in c["legs"] if l[4] != "void"]
              if len(kept) < 2: return ("void", 0)
              if any(l[4] != "hit" or not l[3] > 0 for l in kept): return ("miss", 0)
              return ("hit", points([l[3] for l in kept]))
          def leg_ok(l):
              return type(l) is list and len(l) == 5 and type(l[0]) is int and l[0] in (1, 2, 3, 4) and nat(l[1]) and l[1] > 0 and isaddr(l[2]) and type(l[3]) is int and 0 <= l[3] <= 300 and l[4] in RESULTS
          CARD = {"player", "round", "time", "changes", "priceAt", "legs", "state", "outcome", "pts", "settled"}
          def card_ok(c, rnd, day):
              if type(c) is not dict or set(c) != CARD: return False
              if not (isaddr(c["player"]) and same(c["round"], rnd) and nat(c["time"]) and day * DAY <= c["time"] < (day + 1) * DAY and c["time"] <= now): return False
              if not (type(c["changes"]) is int and 0 <= c["changes"] <= MAX_CHANGES): return False
              if not (c["priceAt"] is None or (nat(c["priceAt"]) and c["priceAt"] <= c["time"] and c["time"] - c["priceAt"] <= 3 * HOUR)): return False
              legs = c["legs"]
              if not (type(legs) is list and 2 <= len(legs) <= 10 and all(leg_ok(l) for l in legs)): return False
              keys = [("race", l[0], l[1]) if l[0] != 4 else ("block", l[1]) for l in legs]
              if len(set(keys)) != len(keys) or len({l[2] for l in legs}) != len(legs): return False   # one leg per slot, a producer once
              if c["state"] not in ("pending", "final") or c["outcome"] not in (None, "hit", "miss", "void") or not nat(c["pts"]) or not nat(c["settled"]): return False
              if c["state"] == "final":
                  # (A miss decides as soon as the slot is fixed: its other legs may still be pending. FC2-3.)
                  return (c["outcome"], c["pts"]) == recount(c) and (c["outcome"] == "miss" or all(l[4] != "pending" for l in legs))
              return c["pts"] == 0                                                         # not final: no points yet
          def part_of(f):
              m = re.fullmatch(r"D([0-9]{5})(?:-([0-9]{1,3}))?\.json", f)
              return (int(m.group(1)), int(m.group(2) or 0)) if m else None
          def day_ok(j, f):
              # A day file or one of its parts (fix-check 2 FC2-5: at most 1,000 cards each; part 0 has no "part" key).
              pf = part_of(f)
              if pf is None or type(j) is not dict or not same(j.get("v"), 2) or not nat(j.get("day")) or j["day"] != pf[0]: return False
              if set(j) != ({"v", "day", "start", "slots"} if pf[1] == 0 else {"v", "day", "start", "part", "slots"}) or (pf[1] and not same(j["part"], pf[1])): return False
              if sum(len(s.get("cards") or []) for s in j["slots"] if type(s) is dict) > 1000 if type(j["slots"]) is list else True: return False
              day = j["day"]
              if not same(j["start"], day * DAY) or day > today: return False
              sl = j["slots"]
              if type(sl) is not list or len(sl) > CARDS_PER_DAY: return False
              rounds = [s.get("round") if type(s) is dict else None for s in sl]
              if not all(type(r) is int for r in rounds) or rounds != sorted(set(rounds)): return False
              for s in sl:
                  if set(s) != {"round", "fixed", "cards"} or not nat(s["round"]) or s["round"] // CARDS_PER_DAY != day or type(s["fixed"]) is not bool: return False
                  if s["fixed"] and now < (day + 1) * DAY: return False                  # a day not over can't be fixed
                  cs = s["cards"]
                  if type(cs) is not list or len(cs) > 100000 or not all(card_ok(c, s["round"], day) for c in cs): return False
                  if len({c["player"] for c in cs}) != len(cs): return False
              return True
          ROW = {"a", "place", "pts", "hits", "cards", "best", "days", "lastHit", "staked", "ranked"}
          def rows_ok(rows):
              return type(rows) is list and len(rows) <= 100000 and all(type(x) is dict and set(x) == ROW and isaddr(x["a"]) and all(nat(x[k]) for k in ("place", "pts", "hits", "cards", "best", "days", "lastHit"))
                  and x["place"] >= 1 and x["staked"] in (None, True, False) and type(x["staked"]) in (type(None), bool) and x["ranked"] is (x["staked"] is True) for x in rows) and len({x["a"] for x in rows}) == len(rows)
          def board_ok(j):
              if type(j) is not dict or set(j) != {"v", "updated", "today", "week", "lastWeek", "allTime"} or not same(j["v"], 1) or not iso.fullmatch(str(j["updated"])): return False
              t, w, lw, at = j["today"], j["week"], j["lastWeek"], j["allTime"]
              if not (type(t) is dict and set(t) == {"day", "rows"} and type(t["day"]) is str and ymd.fullmatch(t["day"]) and rows_ok(t["rows"])): return False
              if not (type(w) is dict and set(w) == {"week", "start", "rows"} and nat(w["week"]) and same(w["start"], GENESIS + w["week"] * WEEK) and rows_ok(w["rows"])): return False
              if not (type(at) is dict and set(at) == {"rows"} and rows_ok(at["rows"])): return False
              return lw is None or (type(lw) is dict and set(lw) == {"week", "start", "final", "rows"} and nat(lw["week"]) and same(lw["start"], GENESIS + lw["week"] * WEEK) and type(lw["final"]) is bool and rows_ok(lw["rows"]))
          def day_parts(base, day):
              """Every part of a day in `base`, merged by slot; None if a part isn't the recorder's shape."""
              merged = {}; k = 0
              while True:
                  f = "D%05d.json" % day if k == 0 else "D%05d-%d.json" % (day, k)
                  if not os.path.isfile(os.path.join(base, f)): break
                  j = load(os.path.join(base, f))
                  if not day_ok(j, f): return None
                  for s in j["slots"]:
                      m = merged.setdefault(s["round"], {"round": s["round"], "fixed": s["fixed"], "cards": []})
                      m["cards"] += s["cards"]; m["fixed"] = m["fixed"] and s["fixed"]
                  k += 1
              if k == 0: return []
              out = sorted(merged.values(), key=lambda s: s["round"])
              if any(len({c["player"] for c in s["cards"]}) != len(s["cards"]) for s in out): return None
              return out
          def week_board(w):
              # Fix-check FC-6: last week's board recomputed from the PUBLISHED day files' final cards, as bot/games/combo.ts
              # does (best 10 cards; order: points, hits, the earlier last hit, address; equal on all three: one place).
              by = {}
              for day in range((GENESIS + w * WEEK) // DAY, (GENESIS + (w + 1) * WEEK) // DAY):
                  slots = day_parts(pub, day)
                  if slots is None: return None
                  for s in slots:
                      for c in s["cards"]:
                          if c["state"] != "final" or c["outcome"] == "void": continue
                          b = by.setdefault(c["player"], {"list": [], "hits": 0, "lastHit": 0})
                          b["list"].append(c["pts"])
                          if c["outcome"] == "hit": b["hits"] += 1; b["lastHit"] = max(b["lastHit"], c["settled"])
              out = [{"a": a, "pts": sum(sorted(b["list"], reverse=True)[:BEST]), "hits": b["hits"], "lastHit": b["lastHit"]} for a, b in by.items()]
              out.sort(key=lambda r: (-r["pts"], -r["hits"], r["lastHit"] or float("inf"), r["a"]))
              place = 0
              for i, r in enumerate(out):
                  p = out[i - 1] if i else None
                  if not p or (p["pts"], p["hits"], p["lastHit"]) != (r["pts"], r["hits"], r["lastHit"]): place = i + 1
                  r["place"] = place
              return out

          # 1. Each file: its exact shape. A bad file is held (with an alert); an oversized one too (Repo Lens RL-6:
          #    one file never stops the rest).
          names = sorted(os.listdir(d))
          for f in names:
              p = os.path.join(d, f)
              if os.path.isdir(p): continue
              if os.path.getsize(p) > MAX_SIZE: hold("combo/" + f, "over 2 MB", True); continue
              j = load(p)
              if f == "index.json":
                  ok = type(j) is dict and set(j) == {"v", "updated", "days", "contract"} and same(j["v"], 2) and iso.fullmatch(str(j["updated"])) and type(j["days"]) is list \
                      and len(j["days"]) <= 100000 and all(nat(x) and x <= today for x in j["days"]) and j["days"] == sorted(set(j["days"])) and (j["contract"] is None or isaddr(j["contract"]))
              elif f == "board.json": ok = board_ok(j)
              else: ok = day_ok(j, f)
              if not ok: hold("combo/" + f, "not the recorder's shape (or inconsistent: outcomes, points, days, slots)", True)
          # 2. Days against the published ones (Repo Lens RL-7), all parts of a day together: a NEW day only for last week
          #    or this week; a published FIXED slot keeps exactly its cards (who, legs, time, changes); a published FINAL
          #    card never changes; and a NEW final card's leg results must be what the published race-data and Block X
          #    files show (fix-check 2 FC2-1: one bad record run can't publish a made-up win). A day that breaks this is
          #    held ALONE (all its parts), with an alert (FC-5, FC-9).
          def race_record(rnd):
              start = rnd * 6 * HOUR; w = (start - GENESIS) // WEEK
              if w not in RACE_FILES: RACE_FILES[w] = load(os.path.join(raced, "W%03d.json" % w)) if raced and os.path.isfile(os.path.join(raced, "W%03d.json" % w)) else None
              j = RACE_FILES[w]
              if type(j) is not dict or type(j.get("races")) is not list: return False
              rid = time.strftime("%Y-%m-%dT%H", time.gmtime(start // 1000))
              return next((r for r in j["races"] if type(r) is dict and r.get("id") == rid), None)
          BX_TARGETS = {}
          for f in (sorted(os.listdir(bxd)) if bxd and os.path.isdir(bxd) else []):
              j = load(os.path.join(bxd, f))
              for t in (j.get("targets") or [] if type(j) is dict else []):
                  if type(t) is dict and type(t.get("round")) is int and t.get("height") == t["round"] * 2400: BX_TARGETS[t["round"]] = t
          RACE_FILES = {}
          def target_of(rnd): return BX_TARGETS.get(rnd)
          def expected(l):
              # As combo-math.js legResult; False when the source can't be read.
              if l[0] != 4:
                  r = race_record(l[1])
                  if r is False: return False
                  res = r.get("result") if type(r) is dict else None
                  if type(res) is not dict or res.get("final") is not True: return "pending"
                  if res.get("missed") or res.get("void") or type(res.get("standings")) is not list or res.get("checked") != 2: return "unresolved"
                  st = res["standings"]; i = next((k for k, x in enumerate(st) if type(x) is dict and x.get("a") == l[2]), -1)
                  if i < 0: return "void"
                  if not (type(st[i].get("steps")) in (int, float) and st[i]["steps"] > 0): return "miss"
                  need = 1 if l[0] == 1 else 3 if l[0] == 2 else len(st) // 2
                  return "hit" if i < need else "miss"
              if not bxd or not os.path.isdir(bxd): return False
              t = target_of(l[1])
              if type(t) is not dict or t.get("final") is not True: return "pending"
              if t.get("checked") != 2 or not isaddr(t.get("signer")): return "unresolved"
              return "hit" if t["signer"] == l[2] else "miss"
          def legs_supported(c):
              for l in c["legs"]:
                  e = expected(l)
                  if e is False: return "its sources (race-data, Block X) can't be read here"
                  # "unresolved" may also come from the recorder's own checks (no price card, a held read, the deadline):
                  # it can only void a card, never make one score. "pending" only on a miss, which decides anyway.
                  if l[4] == e or l[4] == "unresolved" or (l[4] == "pending" and c["outcome"] == "miss"): continue
                  return "leg %s (round %s) is %s but its source shows %s" % (l[2], l[1], l[4], e)
              return None
          new_days = sorted({part_of(f)[0] for f in names if part_of(f)})
          for day in new_days:
              files = [f for f in names if part_of(f) and part_of(f)[0] == day]
              if any(("combo/" + f) in held for f in files): 
                  for f in files: hold("combo/" + f, "another part of its day is held", True)
                  continue
              new = day_parts(d, day); old = day_parts(pub, day)
              why = ""
              if new is None: why = "its parts don't fit together (a player twice in a slot)"
              elif old is None: why = "the published day can't be read"
              elif not old and day < first_day: why = "a new file for a day before last week"
              else:
                  mine = {s["round"]: s for s in new}
                  for s in old:
                      n = mine.get(s["round"])
                      if s["fixed"] is True:
                          key = lambda cs: sorted(json.dumps([c.get("player"), [l[:3] for l in c.get("legs") or []], c.get("time"), c.get("changes")]) for c in cs)
                          if n is None or n["fixed"] is not True or key(n["cards"]) != key(s["cards"]): why = "fixed slot %s changed" % s["round"]; break
                      nc = {c["player"]: c for c in (n["cards"] if n else [])}
                      bad = [c["player"] for c in s["cards"] if c["state"] == "final" and not same(nc.get(c["player"]), c)]
                      if bad: why = "a final card of %s in slot %s changed" % (bad[0], s["round"]); break
                  if not why:
                      was = {(s["round"], c["player"]) for s in old for c in s["cards"] if c["state"] == "final"}
                      for s in new:
                          for c in s["cards"]:
                              if c["state"] != "final" or (s["round"], c["player"]) in was: continue
                              w2 = legs_supported(c)
                              if w2: why = "the new final card of %s in slot %s: %s" % (c["player"], s["round"], w2); break
                          if why: break
              if why:
                  for f in files: hold("combo/" + f, why, True)
          # Fix-check 2 FC2-4: a board for another week than this job's clock is an old (rewound) board.
          if "combo/board.json" not in held and os.path.isfile(os.path.join(d, "board.json")):
              bw = load(os.path.join(d, "board.json"))["week"]["week"]
              if bw != cw and not (bw == cw - 1 and now - (GENESIS + cw * WEEK) < 2 * HOUR): hold("combo/board.json", "its week (%s) isn't this job's week (%s)" % (bw, cw), True)
          # Fix-check FC-23 (Block X BX-96): index.json's day list is append-only; new days only last week or this week.
          pi = load(os.path.join(pub, "index.json")) if os.path.isfile(os.path.join(pub, "index.json")) else None
          if type(pi) is dict and type(pi.get("days")) is list and os.path.isfile(os.path.join(d, "index.json")) and "combo/index.json" not in held:
              ni = load(os.path.join(d, "index.json"))
              lost = [x for x in pi["days"] if x not in ni["days"]]
              added = [x for x in ni["days"] if x not in pi["days"] and not (type(x) is int and first_day <= x <= today)]
              if lost or added: hold("combo/index.json", ("published days %s are missing" % lost[:5]) if lost else ("new days %s aren't last week or this week" % added[:5]), True)
          # 3. Vault files: write-once, only for the week that just ended within the Vault's 3 days by this job's clock,
          #    and exactly the staked players with 1+ point of the PUBLISHED final board, whose points must equal the
          #    PUBLISHED day files' final cards (fix-check FC-6), mapped by board place (FC-17).
          vdir = os.path.join(d, "vault")
          pb = load(os.path.join(pub, "board.json")) if os.path.isfile(os.path.join(pub, "board.json")) else None
          plw = pb.get("lastWeek") if type(pb) is dict else None
          for f in (sorted(os.listdir(vdir)) if os.path.isdir(vdir) else []):
              name = "combo/vault/" + f
              j = load(os.path.join(vdir, f))
              if not (type(j) is dict and set(j) == {"game", "week", "final", "rows", "first", "second"} and same(j["game"], 8) and nat(j["week"]) and f == "W%d.json" % j["week"]
                      and j["final"] is True and same(j["first"], []) and same(j["second"], []) and type(j["rows"]) is list and len(j["rows"]) <= 100000
                      and all(type(r) is dict and set(r) == {"player", "points"} and isaddr(r["player"]) and type(r["points"]) is int and 1 <= r["points"] <= 255 for r in j["rows"])
                      and len({r["player"] for r in j["rows"]}) == len(j["rows"])):
                  hold(name, "not the Vault file's shape", True); continue
              w = j["week"]; end = GENESIS + (w + 1) * WEEK
              if os.path.isfile(os.path.join(pub, "vault", f)): continue                  # write-once: the push step skips it
              if w != cw - 1 or not (end <= now <= end + 3 * DAY): hold(name, "not the week that just ended, within the Vault's 3 days, by this job's clock", w != cw); continue
              if not (type(plw) is dict and board_ok(pb) and same(plw["week"], w) and plw["final"] is True and now >= end + 12 * HOUR): hold(name, "its week isn't final on the published board yet", False); continue
              truth = week_board(w)
              if truth is None: hold(name, "a published day file of its week isn't the recorder's shape", True); continue
              rows = {r["a"]: r for r in plw["rows"]}
              wrong = [t["a"] for t in truth if t["pts"] >= MIN_WEEK_PTS and not (t["a"] in rows and same(rows[t["a"]]["pts"], t["pts"]) and same(rows[t["a"]]["place"], t["place"]))]
              wrong += [a for a, r in rows.items() if r["pts"] >= MIN_WEEK_PTS and not any(t["a"] == a for t in truth)]
              if wrong: hold(name, "the published board's last week doesn't match the published final cards (e.g. %s)" % wrong[0], True); continue
              ok = [t for t in truth if t["pts"] >= MIN_WEEK_PTS and rows[t["a"]]["staked"] is True]
              distinct = sorted({t["place"] for t in ok}); rank = {pl: max(1, 255 - i) for i, pl in enumerate(distinct)}
              want = [{"player": t["a"], "points": rank[t["place"]]} for t in ok]
              if not same(j["rows"], want): hold(name, "its rows aren't the published final board's staked players with 1+ point, by place", True); continue
          open(heldf, "w").write("".join(x + "\n" for x in held))
          print("combo files checked")
          PY
          shopt -s nullglob
          for f in "$IN"/combo/*.json "$IN"/combo/vault/*.json; do
            name="${f#"$IN"/}"
            if grep -qxF "$name" "$HELD"; then continue; fi
            if [[ "$name" =~ /vault/W[0-9]+\.json$ ]] && git cat-file -e ":$name" 2>/dev/null; then
              # A Vault file is written once and never replaced; one that differs is an alert.
              if [ "$(git hash-object "$f")" != "$(git rev-parse ":$name")" ]; then echo "::error::$name differs from the published file: not replaced."; echo '!alert' >> "$HELD"; fi
              continue
            fi
            blob=$(git hash-object -w "$f")
            git update-index --add --cacheinfo 100644 "$blob" "$name"
          done
          tree=$(git write-tree)
          if [ -n "$parent" ] && [ "$tree" = "$(git rev-parse "$parent^{tree}")" ]; then echo "No changes."
          else
            export GIT_AUTHOR_NAME=kpred-bot GIT_AUTHOR_EMAIL=kpred-bot@users.noreply.github.com GIT_COMMITTER_NAME=kpred-bot GIT_COMMITTER_EMAIL=kpred-bot@users.noreply.github.com
            commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "games: record combo")
            # One try: if another job pushed games-data in between, this run's files go out with the next run (the
            # checks above were made against this parent, so a retry would have to repeat them).
            if ! git push -q "$remote" "$commit:refs/heads/games-data"; then echo "::warning::games-data moved while publishing; the next run publishes these files."; fi
          fi
          if grep -qxF '!alert' "$HELD"; then echo "::error::A file was held, or a published file needs your check (see the errors above); everything else was published."; exit 1; fi
          echo "Combo files published."
