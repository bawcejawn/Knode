# On every push and every pull request that touches the game: build the contract, run its tests, and run the offline safety check.
name: Contract tests

on:
  push:
    paths: ["game/**", ".github/workflows/test.yml"]
  pull_request:
    paths: ["game/**", ".github/workflows/test.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: npm test
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
      - name: Show what failed (as annotations on the run page)
        if: failure()
        run: |
          sed 's/\x1b\[[0-9;]*m//g' test.log | grep -E "❌|\[Actual\]|\[Expected\]|ERROR|Error|error|Tests\]" | head -40 | while IFS= read -r l; do echo "::error::$l"; done
      - run: npm run check
