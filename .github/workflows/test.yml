# On every push: build the game contract, run its tests on the simulated chain, and run the offline safety check.
name: Contract tests

on:
  push:
    paths: ["game/**", ".github/workflows/test.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run check
