# Scores every question template from block history. Runs on pushes and on pull requests.
name: Resolver tests

on:
  push:
    paths: ["resolver.ts", "resolver.test.ts", "generator.ts", "common.ts", "bot/bot.ts", "package.json", "package-lock.json", ".github/workflows/resolver-test.yml"]
  pull_request:
    paths: ["resolver.ts", "resolver.test.ts", "generator.ts", "common.ts", "bot/bot.ts", "package.json", "package-lock.json", ".github/workflows/resolver-test.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run test:resolver
